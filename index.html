                    if (Math.abs(drawerVideo.currentTime - audioEl.currentTime) > 0.2) {
                        try { drawerVideo.currentTime = audioEl.currentTime; } catch (e) {}
                    }
                }
                const dur = audioEl.duration || t.duration || 0;
                currentTimeEl.textContent = formatTime(audioEl.currentTime);
                if (dur) timelineFill.style.width = Math.min(100, (audioEl.currentTime / dur) * 100) + '%';
                updateMiniTimelines();
            });

            audioEl.addEventListener('loadedmetadata', () => {
                if (activeTrackIndex < 0) return;
                const t = tracks[activeTrackIndex];
                if (isFinite(audioEl.duration) && audioEl.duration > 0) {
                    t.duration = audioEl.duration;
                    totalTimeEl.textContent = formatTime(audioEl.duration);
                    persistState();
                }
            });

            audioEl.addEventListener('play', () => {
                isPlaying = true;
                updatePlayPauseIcon();
                updateTrackCardVisuals();
                if (activeTrackIndex >= 0 && tracks[activeTrackIndex].videoId) {
                    hardSyncVideo();
                    if (drawerVideo.style.display !== 'none' && drawerVideo.src) {
                        try { drawerVideo.currentTime = audioEl.currentTime; } catch (e) {}
                        drawerVideo.play().catch(() => {});
                    }
                }
            });

            audioEl.addEventListener('pause', () => {
                isPlaying = false;
                updatePlayPauseIcon();
                updateTrackCardVisuals();
                videoEl.pause();
                if (drawerVideo.style.display !== 'none') drawerVideo.pause();
            });

            audioEl.addEventListener('seeking', syncVideoSeek);
            audioEl.addEventListener('seeked', syncVideoSeek);

            audioEl.addEventListener('ended', () => {
                isPlaying = false;
                updatePlayPauseIcon();
                updateTrackCardVisuals();
                videoEl.pause();
                if (tracks.length > 0) playNext();
            });

            playPauseBtn.addEventListener('click', () => {
                if (activeTrackIndex < 0) {
                    if (tracks.length > 0) playTrack(0, true);
                    return;
                }
                playTrack(activeTrackIndex, true);
            });
            prevBtn.addEventListener('click', () => playPrev());
            nextBtn.addEventListener('click', () => playNext());

            playerInfo.addEventListener('click', () => {
                if (activeTrackIndex >= 0) {
                    openDrawer(activeTrackIndex);
                } else {
                    showToast('Ничего не играет');
                }
            });

            function handleTimelineSeek(clientX) {
                if (activeTrackIndex < 0) return;
                const t = tracks[activeTrackIndex];
                const dur = audioEl.duration || t.duration || 0;
                if (!dur) return;
                const rect = timelineTrack.getBoundingClientRect();
                const x = clientX - rect.left;
                const percent = Math.max(0, Math.min(1, x / rect.width));
                const newTime = percent * dur;
                if (audioEl.src) audioEl.currentTime = newTime;
                if (t.videoId && videoEl.src) { try { videoEl.currentTime = newTime; } catch (e) {} }
                if (drawerVideo.style.display !== 'none' && drawerVideo.src && t.videoId) {
                    try { drawerVideo.currentTime = newTime; } catch (e) {}
                }
                currentTimeEl.textContent = formatTime(newTime);
                timelineFill.style.width = (percent * 100) + '%';
                updateMiniTimelines();
            }

            timelineTrack.addEventListener('click', (e) => handleTimelineSeek(e.clientX));

            let isTimelineDragging = false;
            timelineTrack.addEventListener('touchstart', (e) => {
                isTimelineDragging = true;
                if (e.touches[0]) handleTimelineSeek(e.touches[0].clientX);
            }, { passive: true });
            timelineTrack.addEventListener('touchmove', (e) => {
                if (isTimelineDragging && e.touches[0]) handleTimelineSeek(e.touches[0].clientX);
            }, { passive: true });
            timelineTrack.addEventListener('touchend', () => { isTimelineDragging = false; });

            videoToggleBtn.addEventListener('click', async () => {
                if (activeTrackIndex < 0) return;
                const t = tracks[activeTrackIndex];
                if (!t.videoId) { showToast('У этого трека нет клипа'); return; }

                if (drawerVideo.style.display !== 'none' && drawerVideo.src) {
                    drawerVideo.pause();
                    drawerVideo.style.display = 'none';
                    drawerVideo.removeAttribute('src');
                    drawerVideo.load();
                    videoToggleBtn.classList.remove('active');
                    updatePlayerInfo();
                    return;
                }
                if (currentDetailIndex !== activeTrackIndex) openDrawer(activeTrackIndex);
                else await refreshDrawer(activeTrackIndex);
                setTimeout(async () => {
                    const url = await getVideoUrlForTrack(t);
                    if (url) {
                        drawerVideo.src = url;
                        drawerVideo.style.display = 'block';
                        drawerVideo.muted = true;
                        try { drawerVideo.currentTime = audioEl.currentTime; } catch (e) {}
                        if (isPlaying) drawerVideo.play().catch(() => {});
                        else drawerVideo.pause();
                        videoToggleBtn.classList.add('active');
                        updatePlayerInfo();
                    }
                }, 120);
            });

            // ========== MOBILE DROPDOWN ==========
            function buildDropdownContent(trackIndex) {
                const track = tracks[trackIndex];
                if (!track) return '';
                let html = `<div class="mobile-dropdown-title">${track.title}</div>`;

                if (playlists.length > 0) {
                    html += `<div class="dropdown-header">Добавить в плейлист</div>`;
                    playlists.forEach(p => {
                        const already = (playlistTrackMap[p] || []).includes(track.id);
                        html += `
                            <button class="dropdown-item pl" data-add-playlist="${p.replace(/"/g, '&quot;')}" data-track-index="${trackIndex}">
                                <span class="material-icons">${already ? 'check' : 'playlist_add'}</span>
                                ${p}
                            </button>
                        `;
                    });
                } else {
                    html += `<div style="padding:8px 14px; font-size:0.75rem; color:var(--text-secondary);">Нет плейлистов</div>`;
                }

                html += `<div style="border-top:1px solid var(--border-light); margin:6px 0;"></div>`;
                html += `<button class="dropdown-item" data-details-index="${trackIndex}">
                    <span class="material-icons">info</span> Подробнее
                </button>`;
                html += `<button class="dropdown-item" data-cover-index="${trackIndex}">
                    <span class="material-icons">image</span> Загрузить обложку
                </button>`;
                return html;
            }

            function openMobileDropdown(trackIndex) {
                mobileMenuTrackIndex = trackIndex;
                mobileDropdownContent.innerHTML = buildDropdownContent(trackIndex);
                mobileDropdownOverlay.classList.add('open');
            }

            function closeMobileDropdown() {
                mobileDropdownOverlay.classList.remove('open');
                mobileMenuTrackIndex = -1;
            }

            mobileDropdownOverlay.addEventListener('click', (e) => {
                if (e.target === mobileDropdownOverlay) closeMobileDropdown();
            });

            mobileDropdownContent.addEventListener('click', (e) => {
                const item = e.target.closest('.dropdown-item');
                if (!item) return;
                e.stopPropagation();

                if (item.hasAttribute('data-add-playlist')) {
                    const p = item.getAttribute('data-add-playlist');
                    const trackIndex = parseInt(item.dataset.trackIndex, 10);
                    const track = tracks[trackIndex];
                    const already = (playlistTrackMap[p] || []).includes(track.id);
                    if (already) {
                        removeTrackFromPlaylist(track.id, p);
                        showToast('Удалено из «' + p + '»');
                    } else {
                        addTrackToPlaylist(track.id, p);
                        showToast('Добавлено в «' + p + '»');
                    }
                    mobileDropdownContent.innerHTML = buildDropdownContent(trackIndex);
                    if (currentView === 'library') renderLibrary();
                    if (currentView === 'playlists') renderPlaylists();
                } else if (item.hasAttribute('data-details-index')) {
                    const idx = parseInt(item.dataset.detailsIndex, 10);
                    closeMobileDropdown();
                    openDrawer(idx);
                } else if (item.hasAttribute('data-cover-index')) {
                    const idx = parseInt(item.dataset.coverIndex, 10);
                    closeMobileDropdown();
                    triggerCoverUpload(idx);
                }
            });

            // ========== DESKTOP DROPDOWN ==========
            function closeAllDesktopDropdowns() {
                document.querySelectorAll('.track-dropdown.open').forEach(d => d.classList.remove('open'));
            }

            document.addEventListener('click', (e) => {
                if (!e.target.closest('.track-dropdown') && !e.target.closest('.track-menu-btn')) {
                    closeAllDesktopDropdowns();
                }
            });

            // ========== COVER UPLOAD ==========
            function triggerCoverUpload(trackIndex) {
                pendingCoverTrackIndex = trackIndex;
                coverFileInputGlobal.value = '';
                coverFileInputGlobal.click();
            }

            coverFileInputGlobal.addEventListener('change', async (e) => {
                const file = e.target.files && e.target.files[0];
                if (!file || !file.type.startsWith('image/')) {
                    if (file) showToast('Выберите изображение');
                    coverFileInputGlobal.value = '';
                    return;
                }
                const idx = pendingCoverTrackIndex;
                if (idx < 0 || idx >= tracks.length) { coverFileInputGlobal.value = ''; return; }
                if (file.size > MAX_COVER_SIZE_MB * 1024 * 1024) {
                    showToast(`Обложка слишком большая (макс. ${MAX_COVER_SIZE_MB} МБ)`);
                    coverFileInputGlobal.value = '';
                    return;
                }

                const t = tracks[idx];
                const coverId = uid('c');
                const result = await saveCoverBlob(coverId, file);
                if (!result.ok) {
                    showToast(result.reason === 'too_large' ? 'Обложка слишком большая' : 'Не удалось сохранить обложку');
                    coverFileInputGlobal.value = '';
                    return;
                }
                if (t.coverId) await removeCoverBlob(t.coverId);
                t.coverId = coverId;
                t.coverMime = file.type;

                const url = URL.createObjectURL(file);
                objectUrls['c_' + coverId] = url;

                persistState();
                showToast('Обложка установлена');
                if (currentView === 'library') renderLibrary();
                if (currentView === 'playlists') renderPlaylists();
                if (currentDetailIndex === idx) await refreshDrawer(idx);
                updateStorageInfo();
                coverFileInputGlobal.value = '';
                pendingCoverTrackIndex = -1;
            });

            // ========== RENDER LIBRARY ==========
            async function renderLibrary() {
                pageTitle.textContent = 'Библиотека';
                settingsPanel.classList.remove('visible');
                settingsVisible = false;
                headerActions.style.display = 'flex';
                closeAllDesktopDropdowns();

                if (tracks.length === 0) {
                    dynamicContent.innerHTML = `<div style="text-align:center; padding:60px 20px; color:var(--text-secondary); background:var(--bg-secondary); border-radius:var(--radius-card); border:1px dashed var(--border-light);">
                        <span class="material-icons" style="font-size:48px; display:block; margin-bottom:12px;">music_off</span>
                        Нет треков. Нажмите «Сканировать» чтобы выбрать папку с музыкой или «Вручную» для выбора файлов.
                    </div>`;
                    return;
                }

                const coverUrls = {};
                for (let i = 0; i < tracks.length; i++) {
                    if (tracks[i].coverId) {
                        const url = await getCoverUrlForTrack(tracks[i]);
                        if (url) coverUrls[tracks[i].coverId] = url;
                    }
                }

                let html = `<div class="track-grid">`;
                tracks.forEach((track, index) => {
                    const isCurrent = (index === activeTrackIndex);
                    const isPlayingTrack = (index === activeTrackIndex && isPlaying);
                    const coverUrl = track.coverId ? coverUrls[track.coverId] : null;

                    let dropdownItems = `<div class="dropdown-header">Добавить в плейлист</div>`;
                    playlists.forEach(p => {
                        const already = (playlistTrackMap[p] || []).includes(track.id);
                        dropdownItems += `
                            <button class="dropdown-item pl" data-add-playlist="${p.replace(/"/g, '&quot;')}" data-track-index="${index}">
                                <span class="material-icons">${already ? 'check' : 'playlist_add'}</span>
                                ${p}
                            </button>
                        `;
                    });
                    if (playlists.length === 0) {
                        dropdownItems += `<div style="padding:8px 14px; font-size:0.7rem; color:var(--text-secondary);">Нет плейлистов</div>`;
                    }
                    dropdownItems += `<div style="border-top:1px solid var(--border-light); margin:4px 0;"></div>`;
                    dropdownItems += `
                        <button class="dropdown-item" data-details-index="${index}">
                            <span class="material-icons">info</span> Подробнее
                        </button>
                    `;

                    html += `
                        <div class="track-card ${isCurrent ? 'current' : ''} ${isPlayingTrack ? 'playing' : ''}" data-index="${index}">
                            <div class="track-cover ${coverUrl ? 'has-custom' : ''}" data-play-index="${index}">
                                ${coverUrl ? `<img class="cover-img" src="${coverUrl}" alt="">` : ''}
                                <span class="material-icons cover-icon">album</span>
                                <div class="cover-play" title="${isPlayingTrack ? 'Пауза' : 'Воспроизвести'}">
                                    <span class="material-icons play-icon"></span>
                                </div>
                                <button class="cover-upload-btn" data-cover-upload-index="${index}" title="Загрузить обложку">
                                    <span class="material-icons">photo_camera</span>
                                </button>
                            </div>
                            <button class="track-menu-btn" data-menu-index="${index}" title="Опции">
                                <span class="material-icons">more_vert</span>
                            </button>
                            <div class="track-dropdown" id="dropdown-${index}">
                                ${dropdownItems}
                            </div>
                            <div class="track-meta">
                                <span class="track-title" data-detail-index="${index}">${track.title}</span>
                                <span class="track-artist">${track.artist || 'Неизвестный исполнитель'}</span>
                            </div>
                            <div class="track-footer">
                                <span class="track-badge">${formatTime(track.duration || 0)}</span>
                                ${track.videoId ? '<span class="video-badge"><span class="material-icons">videocam</span> клип</span>' : ''}
                            </div>
                            <div class="mini-timeline"><div class="mini-timeline-fill"></div></div>
                        </div>
                    `;
                });
                html += `</div>`;
                dynamicContent.innerHTML = html;

                document.querySelectorAll('.track-cover').forEach(cover => {
                    cover.addEventListener('click', (e) => {
                        if (e.target.closest('.cover-upload-btn')) return;
                        e.stopPropagation();
                        playTrack(parseInt(cover.dataset.playIndex, 10), true);
                    });
                });

                document.querySelectorAll('.cover-upload-btn').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        const idx = parseInt(btn.dataset.coverUploadIndex, 10);
                        triggerCoverUpload(idx);
                    });
                });

                document.querySelectorAll('.track-title').forEach(titleEl => {
                    titleEl.addEventListener('click', (e) => {
                        e.stopPropagation();
                        openDrawer(parseInt(titleEl.dataset.detailIndex, 10));
                    });
                });

                document.querySelectorAll('.track-menu-btn').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        const idx = parseInt(btn.dataset.menuIndex, 10);
                        if (isMobile()) {
                            if (mobileDropdownOverlay.classList.contains('open') && mobileMenuTrackIndex === idx) {
                                closeMobileDropdown();
                            } else {
                                openMobileDropdown(idx);
                            }
                        } else {
                            const dropdown = document.getElementById('dropdown-' + idx);
                            const isOpen = dropdown.classList.contains('open');
                            closeAllDesktopDropdowns();
                            if (!isOpen) dropdown.classList.add('open');
                        }
                    });
                });

                document.querySelectorAll('.track-dropdown').forEach(dropdown => {
                    dropdown.addEventListener('click', (e) => {
                        const item = e.target.closest('.dropdown-item');
                        if (!item) return;
                        e.stopPropagation();

                        if (item.hasAttribute('data-add-playlist')) {
                            const p = item.getAttribute('data-add-playlist');
                            const trackIndex = parseInt(item.dataset.trackIndex, 10);
                            const track = tracks[trackIndex];
                            const already = (playlistTrackMap[p] || []).includes(track.id);
                            if (already) {
                                removeTrackFromPlaylist(track.id, p);
                                showToast('Удалено из «' + p + '»');
                            } else {
                                addTrackToPlaylist(track.id, p);
                                showToast('Добавлено в «' + p + '»');
                            }
                            closeAllDesktopDropdowns();
                            if (currentView === 'library') renderLibrary();
                            if (currentView === 'playlists') renderPlaylists();
                        } else if (item.hasAttribute('data-details-index')) {
                            const idx = parseInt(item.dataset.detailsIndex, 10);
                            closeAllDesktopDropdowns();
                            openDrawer(idx);
                        }
                    });
                });

                updateMiniTimelines();
            }

            // ========== RENDER PLAYLISTS ==========
            function renderPlaylists() {
                pageTitle.textContent = 'Плейлисты';
                settingsPanel.classList.remove('visible');
                settingsVisible = false;
                headerActions.style.display = 'none';

                let html = `
                    <div class="playlist-section">
                        <div class="custom-input-row">
                            <input type="text" id="playlistNameInput" placeholder="Название плейлиста..." autocomplete="off">
                            <button class="create-playlist-btn" id="createPlaylistBtn">
                                <span class="material-icons">add</span> Создать
                            </button>
                        </div>
                        <div class="playlist-chips" id="playlistChips">
                `;

                playlists.forEach((name) => {
                    const isExpanded = expandedPlaylist === name;
                    html += `
                        <div class="playlist-chip ${isExpanded ? 'expanded' : ''}" data-playlist-name="${name.replace(/"/g, '&quot;')}">
                            <span class="material-icons">${isExpanded ? 'folder_open' : 'playlist_play'}</span>
                            ${name}
                        </div>
                    `;
                });

                html += `</div>`;

                if (expandedPlaylist) {
                    const ids = playlistTrackMap[expandedPlaylist] || [];
                    const plTracks = ids.map(id => getTrackById(id)).filter(Boolean);
                    html += `<div class="playlist-tracks visible">`;
                    if (plTracks.length === 0) {
                        html += `<div style="color:var(--text-secondary); font-size:0.85rem; padding:8px;">В плейлисте пока нет треков</div>`;
                    } else {
                        plTracks.forEach((t) => {
                            const realIdx = tracks.indexOf(t);
                            html += `
                                <div class="playlist-track-row" data-track-idx="${realIdx}">
                                    <span class="material-icons">audiotrack</span>
                                    <span class="pl-title">${t.title}</span>
                                    <span class="pl-artist">${t.artist}</span>
                                </div>
                            `;
                        });
                    }
                    html += `</div>`;
                }

                html += `</div>`;
                dynamicContent.innerHTML = html;

                document.querySelectorAll('.playlist-chip').forEach(chip => {
                    chip.addEventListener('click', () => {
                        const name = chip.dataset.playlistName;
                        expandedPlaylist = (expandedPlaylist === name) ? null : name;
                        renderPlaylists();
                    });
                });

                document.querySelectorAll('.playlist-track-row').forEach(row => {
                    row.addEventListener('click', () => {
                        playTrack(parseInt(row.dataset.trackIdx, 10), true);
                    });
                });

                const createBtn = document.getElementById('createPlaylistBtn');
                const nameInput = document.getElementById('playlistNameInput');

                const createPlaylist = () => {
                    if (!nameInput) return;
                    const newName = nameInput.value.trim();
                    if (newName === '') {
                        nameInput.style.borderColor = '#ff4d4d';
                        setTimeout(() => { if (nameInput) nameInput.style.borderColor = ''; }, 1000);
                        showToast('Введите название');
                        return;
                    }
                    if (playlists.includes(newName)) {
                        nameInput.style.borderColor = '#ffaa33';
                        setTimeout(() => { if (nameInput) nameInput.style.borderColor = ''; }, 1000);
                        showToast('Такой плейлист уже есть');
                        return;
                    }
                    playlists.push(newName);
                    playlistTrackMap[newName] = [];
                    persistState();
                    showToast('Плейлист создан');
                    renderPlaylists();
                };

                createBtn.addEventListener('click', createPlaylist);
                nameInput.addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') { e.preventDefault(); createPlaylist(); }
                });
                nameInput.focus();
            }

            // ========== DRAWER ==========
            async function refreshDrawer(index) {
                if (index < 0 || index >= tracks.length) return;
                const t = tracks[index];
                detailTitle.textContent = t.title;
                detailArtist.textContent = t.artist || 'Неизвестный исполнитель';
                detailAlbum.textContent = t.album || '—';
                detailDuration.textContent = formatTime(t.duration || 0);
                detailFormat.textContent = t.format || '—';

                const inLists = getPlaylistsForTrack(t.id);
                detailPlaylists.textContent = inLists.length ? inLists.join(', ') : 'Не добавлен ни в один';

                if (t.coverId) {
                    const url = await getCoverUrlForTrack(t);
                    if (url) {
                        drawerCoverImg.src = url;
                        drawerCoverImg.style.display = 'block';
                        drawerCover.querySelector('.material-icons').style.display = 'none';
                    }
                } else {
                    drawerCoverImg.style.display = 'none';
                    drawerCover.querySelector('.material-icons').style.display = '';
                }

                if (t.videoId) {
                    const url = await getVideoUrlForTrack(t);
                    if (url) {
                        drawerVideo.style.display = 'block';
                        if (drawerVideo.src !== url) { drawerVideo.src = url; drawerVideo.load(); }
                        drawerVideo.muted = true;
                        try { drawerVideo.currentTime = audioEl.currentTime; } catch (e) {}
                        if (isPlaying) drawerVideo.play().catch(() => {});
                        else drawerVideo.pause();

                        detailVideoContainer.innerHTML = `
                            <div class="video-status">
                                <span class="material-icons">videocam</span>
                                Клип загружен
                                <button class="remove-video-btn" id="removeVideoBtn">Удалить</button>
                            </div>
                        `;
                        const removeBtn = document.getElementById('removeVideoBtn');
                        if (removeBtn) {
                            removeBtn.addEventListener('click', async () => {
                                await removeVideoBlob(t.videoId);
                                t.videoId = null;
                                t.videoMime = null;
                                videoEl.removeAttribute('src');
                                videoEl.load();
                                drawerVideo.removeAttribute('src');
                                drawerVideo.load();
                                persistState();
                                refreshDrawer(index);
                                showToast('Клип удалён');
                                if (currentView === 'library') renderLibrary();
                                updatePlayerInfo();
                                updateStorageInfo();
                            });
                        }
                    } else {
                        t.videoId = null;
                        persistState();
                        refreshDrawer(index);
                    }
                } else {
                    drawerVideo.style.display = 'none';
                    drawerVideo.removeAttribute('src');
                    drawerVideo.load();
                    detailVideoContainer.innerHTML = `
                        <button class="upload-video-btn" id="uploadVideoBtnInner">
                            <span class="material-icons">video_call</span> Загрузить клип
                        </button>
                    `;
                    const innerBtn = document.getElementById('uploadVideoBtnInner');
                    if (innerBtn) innerBtn.addEventListener('click', () => videoFileInput.click());
                }
            }

            async function openDrawer(index) {
                currentDetailIndex = index;
                await refreshDrawer(index);
                detailsDrawer.classList.add('open');
                drawerOverlay.classList.add('open');
            }

            function closeDrawer() {
                detailsDrawer.classList.remove('open');
                drawerOverlay.classList.remove('open');
                currentDetailIndex = -1;
                if (drawerVideo.style.display !== 'none') drawerVideo.pause();
            }

            drawerClose.addEventListener('click', closeDrawer);
            drawerOverlay.addEventListener('click', closeDrawer);

            // ========== EDIT METADATA ==========
            detailsDrawer.addEventListener('click', (e) => {
                const editBtn = e.target.closest('.edit-btn');
                if (!editBtn) return;
                e.preventDefault();
                e.stopPropagation();
                const field = editBtn.dataset.edit;
                if (!field || currentDetailIndex < 0) return;
                const t = tracks[currentDetailIndex];
                const currentVal = t[field] || '';

                const fieldEl = field === 'title' ? detailTitle : field === 'artist' ? detailArtist : detailAlbum;

                fieldEl.innerHTML = `
                    <input type="text" class="edit-input" value="${String(currentVal).replace(/"/g, '&quot;')}">
                    <div style="display:flex; gap:6px; margin-top:8px;">
                        <button class="save-btn">Сохранить</button>
                        <button class="cancel-btn">Отмена</button>
                    </div>
                `;
                const input = fieldEl.querySelector('.edit-input');
                input.focus();
                input.select();

                const save = () => {
                    const newVal = input.value.trim();
                    if (newVal) t[field] = newVal;
                    persistState();
                    refreshDrawer(currentDetailIndex);
                    if (currentView === 'library') renderLibrary();
                    if (currentView === 'playlists') renderPlaylists();
                    updatePlayerInfo();
                    showToast('Сохранено');
                };
                const cancel = () => refreshDrawer(currentDetailIndex);

                fieldEl.querySelector('.save-btn').addEventListener('click', save);
                fieldEl.querySelector('.cancel-btn').addEventListener('click', cancel);
                input.addEventListener('keypress', (ev) => {
                    if (ev.key === 'Enter') { ev.preventDefault(); save(); }
                    if (ev.key === 'Escape') { ev.preventDefault(); cancel(); }
                });
            });

            uploadVideoBtn.addEventListener('click', () => videoFileInput.click());

            videoFileInput.addEventListener('change', async (e) => {
                const file = e.target.files && e.target.files[0];
                if (!file || !file.type.startsWith('video/')) {
                    showToast('Выберите видео-файл');
                    videoFileInput.value = '';
                    return;
                }
                if (currentDetailIndex < 0) return;
                if (file.size > MAX_VIDEO_SIZE_MB * 1024 * 1024) {
                    showToast(`Клип слишком большой (макс. ${MAX_VIDEO_SIZE_MB} МБ)`);
                    videoFileInput.value = '';
                    return;
                }
                const t = tracks[currentDetailIndex];
                const videoId = uid('v');
                showToast('Сохранение клипа...');
                const result = await saveVideoBlob(videoId, file);
                if (!result.ok) {
                    showToast(result.reason === 'too_large' ? 'Клип слишком большой' : 'Не удалось сохранить');
                    videoFileInput.value = '';
                    return;
                }
                if (t.videoId) await removeVideoBlob(t.videoId);
                t.videoId = videoId;
                t.videoMime = file.type;
                const url = URL.createObjectURL(file);
                objectUrls['v_' + videoId] = url;
                videoEl.src = url;
                videoEl.load();
                videoEl.muted = true;
                persistState();
                showToast('Клип загружен');
                await refreshDrawer(currentDetailIndex);
                videoFileInput.value = '';
                if (currentView === 'library') renderLibrary();
                updatePlayerInfo();
                updateStorageInfo();
            });

            // ========== NAVIGATION ==========
            function updateNavButtons(view) {
                libraryBtn.classList.toggle('active', view === 'library');
                playlistsBtn.classList.toggle('active', view === 'playlists');
                if (mobileLibraryBtn) mobileLibraryBtn.classList.toggle('active', view === 'library');
                if (mobilePlaylistsBtn) mobilePlaylistsBtn.classList.toggle('active', view === 'playlists');
                if (mobileSettingsBtn) mobileSettingsBtn.classList.remove('active');
            }

            function showSettings() {
                pageTitle.textContent = 'Настройки';
                settingsPanel.classList.add('visible');
                settingsVisible = true;
                dynamicContent.innerHTML = '';
                headerActions.style.display = 'none';
                libraryBtn.classList.remove('active');
                playlistsBtn.classList.remove('active');
                if (mobileLibraryBtn) mobileLibraryBtn.classList.remove('active');
                if (mobilePlaylistsBtn) mobilePlaylistsBtn.classList.remove('active');
                if (mobileSettingsBtn) mobileSettingsBtn.classList.add('active');
                updateStorageInfo();
                updateFolderInfo();
            }

            function goToView(view) {
                currentView = view;
                settingsPanel.classList.remove('visible');
                settingsVisible = false;
                expandedPlaylist = null;
                closeAllDesktopDropdowns();
                closeMobileDropdown();
                if (view === 'library') {
                    updateNavButtons('library');
                    renderLibrary();
                } else {
                    updateNavButtons('playlists');
                    renderPlaylists();
                }
            }

            libraryBtn.addEventListener('click', () => goToView('library'));
            playlistsBtn.addEventListener('click', () => goToView('playlists'));
            settingsBtn.addEventListener('click', () => {
                if (settingsVisible) goToView(currentView);
                else showSettings();
            });

            if (mobileLibraryBtn) mobileLibraryBtn.addEventListener('click', () => goToView('library'));
            if (mobilePlaylistsBtn) mobilePlaylistsBtn.addEventListener('click', () => goToView('playlists'));
            if (mobileSettingsBtn) mobileSettingsBtn.addEventListener('click', () => {
                if (settingsVisible) goToView(currentView);
                else showSettings();
            });

            clearStorageBtn.addEventListener('click', () => {
                if (confirm('Удалить все сохранённые треки, клипы и плейлисты?')) clearAllStorage();
            });

            // ========== THEME ==========
            const accentColorPicker = document.getElementById('accentColorPicker');
            const bgColorPicker = document.getElementById('bgColorPicker');
            const darkThemeBtn = document.getElementById('darkThemeBtn');
            const lightThemeBtn = document.getElementById('lightThemeBtn');

            darkThemeBtn.addEventListener('click', () => {
                document.documentElement.style.setProperty('--bg-primary', '#0f0f12');
                document.documentElement.style.setProperty('--bg-secondary', '#1a1a1f');
                document.documentElement.style.setProperty('--bg-elevated', '#25252c');
                document.documentElement.style.setProperty('--text-primary', '#efeff1');
                document.documentElement.style.setProperty('--text-secondary', '#b0b0b8');
                document.documentElement.style.setProperty('--border-light', '#2e2e36');
                bgColorPicker.value = '#0f0f12';
                darkThemeBtn.classList.add('active');
                lightThemeBtn.classList.remove('active');
            });

            lightThemeBtn.addEventListener('click', () => {
                document.documentElement.style.setProperty('--bg-primary', '#f4f4f8');
                document.documentElement.style.setProperty('--bg-secondary', '#ffffff');
                document.documentElement.style.setProperty('--bg-elevated', '#eaeaf0');
                document.documentElement.style.setProperty('--text-primary', '#1e1e24');
                document.documentElement.style.setProperty('--text-secondary', '#5a5a66');
                document.documentElement.style.setProperty('--border-light', '#d0d0dc');
                bgColorPicker.value = '#f4f4f8';
                lightThemeBtn.classList.add('active');
                darkThemeBtn.classList.remove('active');
            });

            accentColorPicker.addEventListener('input', (e) => {
                const color = e.target.value;
                document.documentElement.style.setProperty('--accent', color);
                document.documentElement.style.setProperty('--accent-soft', color + 'cc');
            });

            bgColorPicker.addEventListener('input', (e) => {
                const color = e.target.value;
                function adjustBrightness(hex, percent) {
                    let r = parseInt(hex.slice(1,3), 16), g = parseInt(hex.slice(3,5), 16), b = parseInt(hex.slice(5,7), 16);
                    r = Math.min(255, Math.max(0, r + percent));
                    g = Math.min(255, Math.max(0, g + percent));
                    b = Math.min(255, Math.max(0, b + percent));
                    return `#${((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1)}`;
                }
                const r = parseInt(color.slice(1,3), 16), g = parseInt(color.slice(3,5), 16), b = parseInt(color.slice(5,7), 16);
                const luminance = (0.299 * r + 0.587 * g + 0.114 * b) / 255;
                let secondary, elevated, border, textPrimary, textSecondary;
                if (luminance < 0.5) {
                    secondary = adjustBrightness(color, 20);
                    elevated = adjustBrightness(color, 40);
                    border = adjustBrightness(color, 60);
                    textPrimary = '#efeff1';
                    textSecondary = '#b0b0b8';
                } else {
                    secondary = adjustBrightness(color, -10);
                    elevated = adjustBrightness(color, -25);
                    border = adjustBrightness(color, -35);
                    textPrimary = '#1e1e24';
                    textSecondary = '#5a5a66';
                }
                document.documentElement.style.setProperty('--bg-primary', color);
                document.documentElement.style.setProperty('--bg-secondary', secondary);
                document.documentElement.style.setProperty('--bg-elevated', elevated);
                document.documentElement.style.setProperty('--border-light', border);
                document.documentElement.style.setProperty('--text-primary', textPrimary);
                document.documentElement.style.setProperty('--text-secondary', textSecondary);

                if (luminance < 0.5) {
                    darkThemeBtn.classList.add('active');
                    lightThemeBtn.classList.remove('active');
                } else {
                    lightThemeBtn.classList.add('active');
                    darkThemeBtn.classList.remove('active');
                }
            });

            // ========== INIT ==========
            (async function init() {
                document.documentElement.style.setProperty('--accent-soft', '#2a5a9e');

                const overlay = document.createElement('div');
                overlay.className = 'loading-overlay';
                overlay.innerHTML = `<div class="spinner"></div><span>Загрузка MzMusic...</span>`;
                document.body.appendChild(overlay);

                try { await openDB(); } catch (e) { console.warn('IDB init failed', e); }

                // Try to restore folder handle
                try {
                    const handle = await loadFolderHandle();
                    if (handle) {
                        musicFolderHandle = handle;
                        // Check permission (silently)
                        if (handle.queryPermission) {
                            const perm = await handle.queryPermission({ mode: 'read' });
                            if (perm !== 'granted') {
                                // Keep handle but note permission will be asked on next scan
                                console.log('Folder handle restored; permission will be requested on scan');
                            }
                        }
                    }
                } catch (e) { console.warn('Folder handle restore failed', e); }

                const loaded = await loadState();
                if (loaded) {
                    for (const t of tracks) {
                        if (t.audioId) await getAudioUrlForTrack(t);
                        if (t.videoId) await getVideoUrlForTrack(t);
                        if (t.coverId) await getCoverUrlForTrack(t);
                    }
                }

                // Show scan button as primary if FSAccess supported
                if (hasFSAccess) {
                    scanFolderBtn.classList.add('primary-scan');
                }

                goToView('library');
                updatePlayPauseIcon();
                updatePlayerInfo();
                await updateStorageInfo();
                await updateFolderInfo();

                overlay.remove();
                if (loaded && tracks.length > 0) showToast(`MzMusic: загружено ${tracks.length} треков`);
            })();

            document.querySelectorAll('.player-ctrl-btn, .nav-btn, .mobile-nav-btn, .settings-btn, .cover-play, .timeline-track').forEach(el => {
                el.addEventListener('touchstart', () => {}, { passive: true });
            });

        })();
    </script>
</body>
</html>
