<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0f0f12">
<title>MzMusic</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--bg-primary:#0f0f12;--bg-secondary:#1a1a1f;--bg-elevated:#25252c;--text-primary:#efeff1;--text-secondary:#b0b0b8;--accent:#4f9eff;--accent-soft:#2a5a9e;--border-light:#2e2e36;--shadow:0 8px 20px rgba(0,0,0,.6);--radius-card:16px;--transition:all .2s ease;--font-mono:'JetBrains Mono',monospace;--safe-top:env(safe-area-inset-top,0px);--safe-bottom:env(safe-area-inset-bottom,0px);--safe-left:env(safe-area-inset-left,0px);--safe-right:env(safe-area-inset-right,0px);--mobile-nav-height:60px}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{font-family:var(--font-mono);background:var(--bg-primary);color:var(--text-primary);display:flex;transition:background-color .2s,color .2s;-webkit-font-smoothing:antialiased;position:relative}
.sidebar{width:86px;background:var(--bg-secondary);border-right:1px solid var(--border-light);display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:calc(24px + var(--safe-top)) 0 calc(24px + var(--safe-bottom));flex-shrink:0;height:100vh;height:100dvh;z-index:20}
.sidebar-top{display:flex;flex-direction:column;align-items:center;gap:32px;width:100%}
.brand{font-size:1.05rem;font-weight:700;letter-spacing:-.6px;color:var(--accent);text-align:center;line-height:1.1;padding:0 4px;user-select:none}
.brand span{color:var(--text-primary)}
.nav-btn{background:transparent;border:none;color:var(--text-secondary);cursor:pointer;width:52px;height:52px;border-radius:16px;display:flex;align-items:center;justify-content:center;transition:var(--transition)}
.nav-btn .material-icons{font-size:28px}
.nav-btn:hover{background:var(--bg-elevated);color:var(--text-primary)}
.nav-btn.active{background:var(--accent-soft);color:#fff}
.sidebar-bottom{width:100%;display:flex;flex-direction:column;align-items:center;gap:16px}
.social-links{display:flex;flex-direction:column;align-items:center;gap:6px}
.social-link{display:flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:12px;color:var(--text-secondary);text-decoration:none;transition:var(--transition)}
.social-link:hover{color:var(--accent);transform:translateY(-1px)}
.social-link svg{width:18px;height:18px;fill:currentColor}
.settings-btn{background:transparent;border:none;color:var(--text-secondary);cursor:pointer;width:52px;height:52px;border-radius:16px;display:flex;align-items:center;justify-content:center;transition:color .2s ease,transform .2s ease}
.settings-btn:hover{background:transparent;color:var(--accent);transform:rotate(30deg)}
.settings-btn .material-icons{font-size:26px}
.main{flex:1;height:100vh;height:100dvh;display:flex;flex-direction:column;background:var(--bg-primary);overflow:hidden;position:relative;min-width:0}
.main-scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:calc(28px + var(--safe-top)) 36px 20px;display:flex;flex-direction:column;gap:24px;min-height:0}
.main-scroll::-webkit-scrollbar{width:8px}
.main-scroll::-webkit-scrollbar-track{background:var(--bg-primary)}
.main-scroll::-webkit-scrollbar-thumb{background:var(--border-light);border-radius:8px}
.page-header{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:16px}
.page-title{font-size:1.8rem;font-weight:600;letter-spacing:-.5px;color:var(--text-primary)}
.header-actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.upload-btn{background:var(--bg-elevated);border:1px solid var(--border-light);color:var(--text-primary);padding:10px 18px;border-radius:40px;font-family:var(--font-mono);font-weight:500;cursor:pointer;transition:var(--transition);display:flex;align-items:center;gap:8px;font-size:.85rem}
.upload-btn:hover{background:var(--accent-soft);border-color:var(--accent);color:#fff}
.view-switcher{position:relative}
.view-switcher-btn{background:var(--bg-elevated);border:1px solid var(--border-light);color:var(--text-primary);padding:10px 16px;border-radius:40px;font-family:var(--font-mono);font-weight:500;cursor:pointer;transition:var(--transition);display:flex;align-items:center;gap:8px;font-size:.8rem}
.view-switcher-btn:hover{border-color:var(--accent)}
.view-switcher-btn .material-icons{font-size:18px}
.view-switcher-menu{position:absolute;top:calc(100% + 6px);right:0;background:var(--bg-elevated);border:1px solid var(--border-light);border-radius:12px;box-shadow:var(--shadow);min-width:180px;padding:6px;z-index:200;display:none}
.view-switcher-menu.open{display:block}
.view-switcher-item{padding:10px 14px;font-size:.82rem;color:var(--text-primary);cursor:pointer;border-radius:8px;display:flex;align-items:center;gap:10px;transition:var(--transition);background:transparent;border:none;width:100%;text-align:left;font-family:var(--font-mono)}
.view-switcher-item:hover{background:var(--bg-primary)}
.view-switcher-item .material-icons{font-size:18px;color:var(--accent)}
.view-switcher-item.active{background:var(--accent-soft);color:#fff}
.view-switcher-item.active .material-icons{color:#fff}
.track-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.track-card{background:var(--bg-secondary);border-radius:var(--radius-card);border:1px solid var(--border-light);padding:14px;display:flex;flex-direction:column;gap:10px;transition:var(--transition);position:relative;overflow:visible;content-visibility:auto;contain-intrinsic-size:200px}
.track-card:hover{background:var(--bg-elevated);border-color:var(--accent-soft);transform:translateY(-2px)}
.track-card.current{border-color:var(--accent);background:var(--bg-elevated)}
.track-cover{width:100%;aspect-ratio:1/1;border-radius:12px;background:linear-gradient(135deg,var(--accent-soft),var(--bg-elevated));display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;cursor:pointer}
.track-cover .cover-img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.track-cover .cover-icon{font-size:48px;opacity:.35;color:var(--text-secondary);transition:opacity .2s}
.track-cover.has-custom .cover-icon{display:none}
.track-card:hover .track-cover .cover-icon{opacity:.15}
.cover-play{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:transparent;opacity:0;transition:opacity .2s;cursor:pointer;z-index:2}
.track-card:hover .cover-play,.track-card.current .cover-play{opacity:1}
.cover-play .play-icon{font-size:64px;color:#fff;filter:drop-shadow(0 2px 12px rgba(0,0,0,.6));transition:transform .15s ease;line-height:1}
.cover-play:hover .play-icon{transform:scale(1.12)}
.track-card.current .cover-play .play-icon::before{content:'play_arrow'}
.track-card.current.playing .cover-play .play-icon::before{content:'pause'}
.cover-upload-btn{position:absolute;bottom:8px;left:8px;width:32px;height:32px;border-radius:10px;background:rgba(15,15,18,.75);border:1px solid var(--border-light);color:var(--text-primary);cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:4;transition:var(--transition);backdrop-filter:blur(6px);padding:0}
.cover-upload-btn:hover{background:var(--accent);border-color:var(--accent);color:#fff}
.cover-upload-btn .material-icons{font-size:16px}
.track-meta{display:flex;flex-direction:column;gap:3px;min-width:0;padding-right:36px}
.track-title{font-weight:600;font-size:.9rem;color:var(--text-primary);letter-spacing:-.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;transition:color .15s}
.track-title:hover{color:var(--accent);text-decoration:underline;text-underline-offset:3px}
.track-artist{font-size:.72rem;color:var(--text-secondary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.track-footer{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.track-badge{font-size:.65rem;padding:3px 8px;background:var(--bg-elevated);border-radius:30px;color:var(--text-secondary);border:1px solid var(--border-light)}
.video-badge{display:inline-flex;align-items:center;gap:3px;font-size:.6rem;color:var(--accent);background:var(--bg-primary);border:1px solid var(--accent-soft);border-radius:20px;padding:2px 8px}
.video-badge .material-icons{font-size:12px}
.mini-timeline{display:none;width:100%;height:4px;border-radius:2px;background:var(--bg-primary);position:relative;overflow:hidden;margin-top:2px}
.track-card.current .mini-timeline{display:block}
.mini-timeline-fill{height:100%;width:0;background:var(--accent);border-radius:2px;transition:width .15s linear}
.track-menu-btn{position:absolute;top:22px;right:22px;width:32px;height:32px;border-radius:10px;background:rgba(15,15,18,.75);border:1px solid var(--border-light);color:var(--text-primary);cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:3;transition:var(--transition);backdrop-filter:blur(6px)}
.track-menu-btn:hover{background:var(--accent);border-color:var(--accent);color:#fff}
.track-menu-btn .material-icons{font-size:18px}
.track-list{display:flex;flex-direction:column;gap:8px}
.track-row{display:flex;align-items:center;gap:14px;padding:10px 14px 10px 10px;background:var(--bg-secondary);border-radius:18px;border:1px solid var(--border-light);transition:var(--transition);position:relative;content-visibility:auto;contain-intrinsic-size:80px}
.track-row:hover{background:var(--bg-elevated);border-color:var(--accent-soft)}
.track-row.current{border-color:var(--accent);background:var(--bg-elevated)}
.row-cover{width:56px;height:56px;border-radius:14px;flex-shrink:0;background:linear-gradient(135deg,var(--accent-soft),var(--bg-elevated));position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;cursor:pointer}
.row-cover .row-cover-img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.row-cover .row-cover-icon{font-size:24px;opacity:.4;color:var(--text-secondary)}
.row-cover.has-custom .row-cover-icon{display:none}
.row-play{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(15,15,18,.5);opacity:0;transition:opacity .2s;cursor:pointer;z-index:2}
.track-row:hover .row-play,.track-row.current .row-play{opacity:1}
.row-play .material-icons{font-size:24px;color:#fff;filter:drop-shadow(0 2px 6px rgba(0,0,0,.5))}
.track-row.current .row-play .material-icons::before{content:'play_arrow'}
.track-row.current.playing .row-play .material-icons::before{content:'pause'}
.row-info{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px;cursor:pointer}
.row-title{font-size:.88rem;font-weight:600;color:var(--text-primary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:color .15s}
.row-info:hover .row-title{color:var(--accent)}
.row-artist{font-size:.7rem;color:var(--text-secondary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-timeline{width:100%;height:4px;border-radius:2px;background:var(--bg-primary);overflow:hidden;margin-top:2px}
.row-timeline-fill{height:100%;width:0;background:var(--accent);border-radius:2px;transition:width .15s linear}
.track-row:not(.current) .row-timeline-fill{width:0}
.row-duration{font-size:.7rem;color:var(--text-secondary);flex-shrink:0;min-width:36px;text-align:right;display:flex;align-items:center;justify-content:flex-end;gap:6px}
.row-video-dot{display:inline-flex;align-items:center;color:var(--accent)}
.row-video-dot .material-icons{font-size:14px}
.row-menu-btn{width:32px;height:32px;border-radius:10px;background:transparent;border:1px solid transparent;color:var(--text-secondary);cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:var(--transition);position:relative}
.row-menu-btn:hover{background:var(--bg-primary);border-color:var(--border-light);color:var(--text-primary)}
.row-menu-btn .material-icons{font-size:18px}
.track-dropdown{position:absolute;top:calc(100% + 6px);right:0;background:var(--bg-elevated);border:1px solid var(--border-light);border-radius:12px;box-shadow:var(--shadow);z-index:100;min-width:220px;max-width:90vw;padding:6px;display:none}
.track-dropdown.open{display:block}
.track-card .track-dropdown{top:58px;right:22px}
.track-row .track-dropdown{top:calc(100% + 6px);right:14px}
.dropdown-item{padding:10px 14px;font-size:.8rem;color:var(--text-primary);cursor:pointer;border-radius:8px;display:flex;align-items:center;gap:10px;transition:var(--transition);background:transparent;border:none;width:100%;text-align:left;font-family:var(--font-mono)}
.dropdown-item:hover{background:var(--bg-primary)}
.dropdown-item .material-icons{font-size:16px;color:var(--accent)}
.dropdown-item.pl{padding-left:32px;font-size:.78rem}
.dropdown-item.pl .material-icons{font-size:14px}
.dropdown-header{padding:8px 14px 4px;font-size:.6rem;color:var(--text-secondary);text-transform:uppercase;letter-spacing:1px}
.settings-panel{display:none;flex-direction:column;gap:30px;background:var(--bg-secondary);padding:30px;border-radius:var(--radius-card);border:1px solid var(--border-light)}
.settings-panel.visible{display:flex}
.settings-group{display:flex;flex-direction:column;gap:12px}
.settings-group label{font-weight:500;color:var(--text-primary);letter-spacing:-.2px}
.color-row{display:flex;gap:16px;flex-wrap:wrap;align-items:center}
.color-input{display:flex;align-items:center;gap:10px;background:var(--bg-elevated);padding:8px 16px;border-radius:40px;border:1px solid var(--border-light)}
.color-input input[type=color]{width:44px;height:44px;border:none;background:transparent;cursor:pointer;border-radius:12px}
.theme-toggle{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.theme-btn{background:var(--bg-elevated);border:1px solid var(--border-light);color:var(--text-primary);padding:12px 22px;border-radius:40px;font-family:var(--font-mono);font-weight:500;cursor:pointer;transition:var(--transition);display:flex;align-items:center;gap:8px}
.theme-btn.active{border-color:var(--accent);background:var(--accent-soft);color:#fff}
.storage-info{font-size:.8rem;color:var(--text-secondary);background:var(--bg-elevated);padding:12px 16px;border-radius:12px;border:1px solid var(--border-light);line-height:1.6}
.storage-info .storage-bar{height:8px;border-radius:4px;background:var(--bg-primary);margin-top:8px;overflow:hidden}
.storage-info .storage-bar-fill{height:100%;background:var(--accent);border-radius:4px;transition:width .3s ease}
.clear-storage-btn{background:transparent;border:1px solid #ff6b6b;color:#ff6b6b;padding:10px 20px;border-radius:40px;font-family:var(--font-mono);font-size:.8rem;cursor:pointer;transition:var(--transition);align-self:flex-start}
.clear-storage-btn:hover{background:rgba(255,107,107,.1)}
.playlist-section{display:flex;flex-direction:column;gap:20px}
.custom-input-row{display:flex;align-items:center;gap:12px;background:var(--bg-secondary);padding:8px 8px 8px 24px;border-radius:60px;border:1px solid var(--border-light);max-width:500px}
.custom-input-row input{background:transparent;border:none;color:var(--text-primary);font-family:var(--font-mono);font-size:1rem;padding:14px 6px;outline:none;flex:1;min-width:0}
.custom-input-row input::placeholder{color:var(--text-secondary);opacity:.7}
.create-playlist-btn{background:var(--accent);border:none;color:#fff;padding:14px 24px;border-radius:40px;font-family:var(--font-mono);font-weight:600;cursor:pointer;transition:var(--transition);display:flex;align-items:center;gap:8px;white-space:nowrap;flex-shrink:0}
.create-playlist-btn:hover{background:var(--accent-soft)}
.playlist-chips{display:flex;flex-wrap:wrap;gap:10px}
.playlist-chip{background:var(--bg-elevated);border:1px solid var(--border-light);padding:10px 20px;border-radius:40px;font-size:.9rem;display:flex;align-items:center;gap:8px;cursor:pointer;transition:var(--transition);user-select:none}
.playlist-chip:hover{border-color:var(--accent);background:var(--bg-secondary);transform:translateY(-1px)}
.playlist-chip .material-icons{font-size:18px;color:var(--accent)}
.playlist-chip.expanded{border-color:var(--accent);background:var(--bg-secondary)}
.playlist-tracks{display:none;flex-direction:column;gap:8px;padding:8px;background:var(--bg-secondary);border-radius:var(--radius-card);border:1px solid var(--border-light)}
.playlist-tracks.visible{display:flex}
.player-bar{flex-shrink:0;background:var(--bg-secondary);border-top:1px solid var(--border-light);padding:14px 28px calc(14px + var(--safe-bottom));display:flex;align-items:center;gap:20px;z-index:55}
.player-controls{display:flex;align-items:center;gap:6px}
.player-ctrl-btn{background:transparent;border:none;color:var(--text-secondary);cursor:pointer;width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;transition:var(--transition);position:relative}
.player-ctrl-btn:hover{background:var(--bg-elevated);color:var(--text-primary)}
.player-ctrl-btn.active{color:var(--accent);background:var(--accent-soft)}
.player-ctrl-btn .material-icons{font-size:22px}
.player-ctrl-btn.active::after{content:'';position:absolute;bottom:4px;left:50%;transform:translateX(-50%);width:4px;height:4px;border-radius:50%;background:var(--accent)}
.player-info{display:flex;flex-direction:column;gap:2px;min-width:160px;max-width:220px;cursor:pointer;border-radius:10px;padding:4px 8px;margin:-4px -8px;transition:background .2s}
.player-info:hover{background:var(--bg-elevated)}
.player-info .now-title{font-size:.85rem;font-weight:600;color:var(--text-primary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.player-info .now-artist{font-size:.7rem;color:var(--text-secondary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.player-timeline{flex:1;display:flex;align-items:center;gap:12px;min-width:0}
.time-label{font-size:.7rem;color:var(--text-secondary);min-width:36px;text-align:center;user-select:none}
.timeline-track{flex:1;height:6px;border-radius:3px;background:var(--bg-elevated);position:relative;cursor:pointer;touch-action:none}
.timeline-fill{height:100%;width:0;border-radius:3px;background:var(--accent);position:relative}
.timeline-fill::after{content:'';position:absolute;right:-5px;top:50%;transform:translateY(-50%);width:12px;height:12px;border-radius:50%;background:var(--accent);box-shadow:0 0 6px var(--accent);opacity:0;transition:opacity .2s}
.timeline-track:hover .timeline-fill::after{opacity:1}
.video-toggle-btn{background:var(--bg-elevated);border:1px solid var(--border-light);color:var(--text-secondary);width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:var(--transition);flex-shrink:0}
.video-toggle-btn:hover{color:var(--text-primary);border-color:var(--accent)}
.video-toggle-btn.active{background:var(--accent-soft);border-color:var(--accent);color:#fff}
.volume-control{display:flex;align-items:center;gap:8px;flex-shrink:0;position:relative}
.volume-btn{background:transparent;border:none;color:var(--text-secondary);cursor:pointer;width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;transition:var(--transition);flex-shrink:0}
.volume-btn:hover{color:var(--text-primary);background:var(--bg-elevated)}
.volume-btn .material-icons{font-size:20px}
.volume-slider-wrap{display:flex;align-items:center;gap:6px;width:140px;position:relative}
.volume-slider{flex:1;-webkit-appearance:none;appearance:none;height:6px;border-radius:3px;background:var(--bg-elevated);outline:none;cursor:pointer;position:relative}
.volume-slider::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:14px;height:14px;border-radius:50%;background:var(--accent);cursor:pointer;box-shadow:0 0 6px var(--accent);transition:transform .1s}
.volume-slider::-webkit-slider-thumb:hover{transform:scale(1.15)}
.volume-slider::-moz-range-thumb{width:14px;height:14px;border:none;border-radius:50%;background:var(--accent);cursor:pointer;box-shadow:0 0 6px var(--accent)}
.volume-slider-wrap::before{content:'';position:absolute;left:0;top:50%;transform:translateY(-50%);height:6px;width:calc(62.5% * (var(--vol-fill,0)/100));max-width:62.5%;border-radius:3px;background:var(--accent);pointer-events:none;transition:width .05s linear;z-index:1}
.volume-slider-wrap.boost::before{background:linear-gradient(to right,var(--accent) 0%,var(--accent) 85%,#ffaa33 100%)}
.volume-boost-mark{position:absolute;left:62.5%;top:50%;transform:translate(-50%,-50%);width:2px;height:12px;background:var(--text-secondary);opacity:.6;pointer-events:none;z-index:2;border-radius:1px}
.volume-value{font-size:.62rem;color:var(--text-secondary);min-width:42px;text-align:right;user-select:none;white-space:nowrap}
.volume-value.boost{color:#ffaa33;font-weight:600}
.drawer-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:opacity .25s ease;z-index:40}
.drawer-overlay.open{opacity:1;pointer-events:auto}
.details-drawer{position:fixed;top:0;right:0;width:380px;max-width:100vw;height:100vh;height:100dvh;background:var(--bg-secondary);border-left:1px solid var(--border-light);box-shadow:-12px 0 30px rgba(0,0,0,.4);transform:translateX(100%);transition:transform .3s ease;z-index:95;display:flex;flex-direction:column;padding:calc(28px + var(--safe-top)) 28px calc(28px + var(--safe-bottom));gap:20px;overflow-y:auto;-webkit-overflow-scrolling:touch}
.details-drawer.open{transform:translateX(0)}
.drawer-header{display:flex;justify-content:space-between;align-items:center;padding-bottom:8px;flex-shrink:0}

.drawer-field .field-value input{background:var(--bg-elevated);border:1px solid var(--border-light);color:var(--text-primary);font-family:var(--font-mono);font-size:.9rem;padding:8px 12px;border-radius:8px;width:100%;outline:none;transition:var(--transition)}
.drawer-field .field-value input:focus{border-color:var(--accent)}
.drawer-field .field-value .save-btn,.drawer-field .field-value .cancel-btn{font-family:var(--font-mono);font-size:.75rem;padding:8px 14px;border-radius:8px;border:1px solid var(--border-light);cursor:pointer;background:var(--bg-elevated);color:var(--text-primary);margin-top:6px;margin-right:6px;transition:var(--transition)}
.drawer-field .field-value .save-btn{background:var(--accent);border-color:var(--accent);color:#fff}

.upload-video-btn{background:var(--bg-elevated);border:1px dashed var(--border-light);color:var(--text-secondary);padding:12px;border-radius:12px;font-family:var(--font-mono);font-size:.8rem;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;transition:var(--transition);width:100%;position:relative;z-index:1}
.upload-video-btn:hover{border-color:var(--accent);color:var(--accent);background:var(--bg-primary)}
.video-status{display:flex;align-items:center;gap:8px;font-size:.75rem;color:var(--accent);background:var(--bg-elevated);padding:8px 12px;border-radius:10px;border:1px solid var(--accent-soft)}
.video-status .material-icons{font-size:16px}
.video-warning{display:flex;align-items:flex-start;gap:8px;font-size:.72rem;color:#ffaa33;background:rgba(255,170,51,.08);padding:10px 12px;border-radius:10px;border:1px solid rgba(255,170,51,.3);margin-top:8px;line-height:1.5}
.video-warning .material-icons{font-size:16px;flex-shrink:0}
.remove-video-btn{background:transparent;border:none;color:#ff6b6b;cursor:pointer;font-family:var(--font-mono);font-size:.7rem;padding:4px 8px;border-radius:6px;margin-left:auto}
.remove-video-btn:hover{background:rgba(255,107,107,.1)}
.toast{position:fixed;bottom:calc(100px + var(--safe-bottom));left:50%;transform:translateX(-50%) translateY(20px);background:var(--bg-elevated);color:var(--text-primary);padding:14px 24px;border-radius:40px;border:1px solid var(--border-light);box-shadow:var(--shadow);opacity:0;transition:all .3s ease;z-index:200;font-size:.85rem;pointer-events:none;display:flex;align-items:center;gap:8px;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast .material-icons{font-size:18px;color:var(--accent)}
.toast.warn .material-icons{color:#ffaa33}
.loading-overlay{position:fixed;inset:0;background:rgba(15,15,18,.85);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;z-index:300;color:var(--text-secondary);font-size:.9rem}
.loading-overlay .spinner{width:40px;height:40px;border:3px solid var(--border-light);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.mobile-nav{display:none}
.mobile-dropdown-overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:120;display:none;align-items:flex-end;justify-content:center;backdrop-filter:blur(2px)}
.mobile-dropdown-overlay.open{display:flex}
.mobile-dropdown{background:var(--bg-secondary);border-top-left-radius:20px;border-top-right-radius:20px;width:100%;max-width:100%;padding:16px 16px calc(16px + var(--safe-bottom));max-height:75vh;overflow-y:auto;-webkit-overflow-scrolling:touch;border-top:1px solid var(--border-light);animation:slideUp .25s ease}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}

.mobile-dropdown .mobile-dropdown-title{font-size:.7rem;color:var(--text-secondary);text-transform:uppercase;letter-spacing:1px;margin-bottom:8px;padding:0 6px}
.mobile-dropdown .dropdown-item{padding:14px 12px;font-size:.9rem;border-radius:10px}
.mobile-dropdown .dropdown-item .material-icons{font-size:20px}
.mobile-dropdown .dropdown-item.pl{padding-left:32px;font-size:.85rem}

@media (max-width:800px){

<main class="main">

</div>

</div>

<div class="player-bar">

</div>
<div class="drawer-field">

<div class="drawer-field">

<script>
(function(){
'use strict';
const LS_KEY='mzmusic_data_v9',LS_VIEW='mzmusic_view',LS_SHUF='mzmusic_shuffle',LS_REP='mzmusic_repeat',LS_VOL='mzmusic_volume',LS_MUTE='mzmusic_muted';
const MAX_V=160,MAX_VIDEO=200,MAX_AUDIO=100,MAX_COVER=5,DB_NAME='MzMusicDB',DB_VER=5,CLIP_TOL=30;

let tracks=[],playlists=['Мой плейлист','Избранное'],trackMap={},activeIdx=-1,isPlaying=false,curView='library',settingsOpen=false,detailIdx=-1,expPlaylist=null,urls={},db=null,mobileMenuIdx=-1,pendingCoverIdx=-1;
let viewMode=localStorage.getItem(LS_VIEW)||'grid',shuffleMode=localStorage.getItem(LS_SHUF)==='1',repeatMode=localStorage.getItem(LS_REP)==='1';
let volPct=Math.min(MAX_V,Math.max(0,parseInt(localStorage.getItem(LS_VOL)||'100',10)||100));
let isMuted=localStorage.getItem(LS_MUTE)==='1';
let audioCtx=null,gainNode=null,audioSrc=null;
let coverCache={};

const $=id=>document.getElementById(id);
const libBtn=$('libraryBtn'),plBtn=$('playlistsBtn'),setBtn=$('settingsBtn');
const mLibBtn=$('mobileLibraryBtn'),mPlBtn=$('mobilePlaylistsBtn'),mSetBtn=$('mobileSettingsBtn');
const titleEl=$('pageTitle'),content=$('dynamicContent'),settingsPanel=$('settingsPanel'),headerActions=$('headerActions');
const uploadBtn=$('uploadBtn'),fileInput=$('fileInput'),clearBtn=$('clearStorageBtn'),storageUsed=$('storageUsed'),storageBar=$('storageBarFill');
const viewBtn=$('viewSwitcherBtn'),viewMenu=$('viewSwitcherMenu'),viewIcon=$('viewSwitcherIcon'),viewLabel=$('viewSwitcherLabel');
const audio=$('audioEl'),videoEl=$('videoEl');
const nowT=$('nowTitle'),nowA=$('nowArtist'),playerInfo=$('playerInfo'),playBtn=$('playPauseBtn'),playIcon=$('playPauseIcon');
const prevBtn=$('prevBtn'),nextBtn=$('nextBtn'),shufBtn=$('shuffleBtn'),repBtn=$('repeatBtn');
const curTime=$('currentTime'),totTime=$('totalTime'),tlTrack=$('timelineTrack'),tlFill=$('timelineFill');
const volBtn=$('volumeMuteBtn'),volIcon=$('volumeIcon'),volSlider=$('volumeSlider'),volVal=$('volumeValue'),volWrap=$('volumeSliderWrap');
const vidBtn=$('videoToggleBtn');
const drOverlay=$('drawerOverlay'),dr=$('detailsDrawer'),drClose=$('drawerClose'),drCover=$('drawerCover'),drCoverImg=$('drawerCoverImg'),drVideo=$('drawerVideo');
const dTitle=$('detailTitle'),dArtist=$('detailArtist'),dAlbum=$('detailAlbum'),dDur=$('detailDuration'),dFmt=$('detailFormat'),dPl=$('detailPlaylists'),dVidBox=$('detailVideoContainer');
const upVidBtn=$('uploadVideoBtn'),vidInput=$('videoFileInput'),coverInput=$('coverFileInputGlobal');
const mdOverlay=$('mobileDropdownOverlay'),mdContent=$('mobileDropdownContent');
const toast=$('toast'),toastTxt=$('toastText');
const isMobile=()=>matchMedia('(max-width:800px)').matches;

function openDB(){return new Promise((res,rej)=>{if(db)return res(db);const r=indexedDB.open(DB_NAME,DB_VER);r.onupgradeneeded=e=>{const d=e.target.result;['videos','audio','covers'].forEach(s=>{if(!d.objectStoreNames.contains(s))d.createObjectStore(s)})};r.onsuccess=e=>{db=e.target.result;res(db)};r.onerror=e=>rej(e.target.error)})}
function idbPut(s,k,v){return new Promise(async(res,rej)=>{try{const d=await openDB();const tx=d.transaction(s,'readwrite');tx.objectStore(s).put(v,k);tx.oncomplete=()=>res(true);tx.onerror=e=>rej(e.target.error)}catch(e){rej(e)}})}
function idbGet(s,k){return new Promise(async(res,rej)=>{try{const d=await openDB();const tx=d.transaction(s,'readonly');const r=tx.objectStore(s).get(k);r.onsuccess=()=>res(r.result||null);r.onerror=e=>rej(e.target.error)}catch(e){rej(e)}})}
function idbDel(s,k){return new Promise(async(res)=>{try{const d=await openDB();const tx=d.transaction(s,'readwrite');tx.objectStore(s).delete(k);tx.oncomplete=()=>res(true);tx.onerror=()=>res(false)}catch(e){res(false)}})}
function idbClear(s){return new Promise(async(res)=>{try{const d=await openDB();const tx=d.transaction(s,'readwrite');tx.objectStore(s).clear();tx.oncomplete=()=>res(true);tx.onerror=()=>res(false)}catch(e){res(false)}})}

const saveAudio=async(id,b)=>{try{await idbPut('audio',id,b);return true}catch(e){return false}};
const loadAudio=async(id)=>{try{return await idbGet('audio',id)}catch(e){return null}};
const delAudio=async(id)=>{await idbDel('audio',id);if(urls['a_'+id]){try{URL.revokeObjectURL(urls['a_'+id])}catch(e){};delete urls['a_'+id]}};
const saveVideo=async(id,b)=>{if(b.size>MAX_VIDEO*1048576)return{ok:false};try{await idbPut('videos',id,b);return{ok:true}}catch(e){return{ok:false}}};
const loadVideo=async(id)=>{try{return await idbGet('videos',id)}catch(e){return null}};
const delVideo=async(id)=>{await idbDel('videos',id);if(urls['v_'+id]){try{URL.revokeObjectURL(urls['v_'+id])}catch(e){};delete urls['v_'+id]}};
const saveCover=async(id,b)=>{if(b.size>MAX_COVER*1048576)return{ok:false};try{await idbPut('covers',id,b);return{ok:true}}catch(e){return{ok:false}}};
const loadCover=async(id)=>{try{return await idbGet('covers',id)}catch(e){return null}};
const delCover=async(id)=>{await idbDel('covers',id);if(urls['c_'+id]){try{URL.revokeObjectURL(urls['c_'+id])}catch(e){};delete urls['c_'+id]}};

async function getAudioUrl(t){
  if(!t||!t.audioId)return null;
  const k='a_'+t.audioId;
  if(urls[k])return urls[k];
  const b=await loadAudio(t.audioId);
  if(!b)return null;
  const u=URL.createObjectURL(b);urls[k]=u;return u;
}
async function getVideoUrl(t){
  if(!t||!t.videoId)return null;
  const k='v_'+t.videoId;
  if(urls[k])return urls[k];
  const b=await loadVideo(t.videoId);
  if(!b)return null;
  const u=URL.createObjectURL(b);urls[k]=u;return u;
}
async function getCoverUrl(t){
  if(!t||!t.coverId)return null;
  if(coverCache[t.id]!==undefined)return coverCache[t.id];
  const k='c_'+t.coverId;
  if(urls[k]){coverCache[t.id]=urls[k];return urls[k]}
  const b=await loadCover(t.coverId);
  if(!b){coverCache[t.id]=null;return null}
  const u=URL.createObjectURL(b);urls[k]=u;coverCache[t.id]=u;return u;
}

function serialize(){
  return{
    tracks:tracks.map(t=>({id:t.id,title:t.title,artist:t.artist,album:t.album,duration:t.duration,format:t.format,mime:t.mime,audioId:t.audioId,videoId:t.videoId,videoMime:t.videoMime,videoDuration:t.videoDuration,coverId:t.coverId,coverMime:t.coverMime,_on:t._originalName,_os:t._originalSize,_lm:t._lastModified})),
    playlists,playlistTrackMap:trackMap,version:9
  };
}
function persist(){try{localStorage.setItem(LS_KEY,JSON.stringify(serialize()))}catch(e){}}
async function loadState(){
  const raw=localStorage.getItem(LS_KEY)||localStorage.getItem('mzmusic_data_v8')||localStorage.getItem('mzmusic_data_v7')||localStorage.getItem('mzmusic_data_v6')||localStorage.getItem('mzmusic_data_v5')||localStorage.getItem('mzmusic_data_v4')||localStorage.getItem('mzmusic_data_v3')||localStorage.getItem('mzmusic_data_v2')||localStorage.getItem('mzmusic_data_v1');
  if(!raw)return false;
  try{
    const d=JSON.parse(raw);if(!d||!Array.isArray(d.tracks))return false;
    tracks=d.tracks.map(t=>({id:t.id||'t_'+Math.random().toString(36).slice(2),title:t.title||'Без названия',artist:t.artist||'Неизвестный исполнитель',album:t.album||'—',duration:t.duration||0,format:t.format||'—',mime:t.mime||'audio/mpeg',audioId:t.audioId||null,videoId:t.videoId||null,videoMime:t.videoMime||'video/mp4',videoDuration:t.videoDuration||0,coverId:t.coverId||null,coverMime:t.coverMime||'image/jpeg',_originalName:t._on||t._originalName||null,_originalSize:t._os||t._originalSize||null,_lastModified:t._lm||t._lastModified||null}));
    playlists=Array.isArray(d.playlists)&&d.playlists.length?d.playlists:['Мой плейлист','Избранное'];
    trackMap=d.playlistTrackMap||{};
    playlists.forEach(p=>{if(!Array.isArray(trackMap[p]))trackMap[p]=[]});
    return true;
  }catch(e){return false}
}
async function clearAll(){
  localStorage.removeItem(LS_KEY);
  await idbClear('audio');await idbClear('videos');await idbClear('covers');
  Object.keys(urls).forEach(k=>{try{URL.revokeObjectURL(urls[k])}catch(e){}});
  urls={};coverCache={};tracks=[];playlists=['Мой плейлист','Избранное'];trackMap={'Мой плейлист':[],'Избранное':[]};
  activeIdx=-1;isPlaying=false;
  audio.pause();audio.removeAttribute('src');audio.load();
  videoEl.pause();videoEl.removeAttribute('src');videoEl.load();
  updPlayIcon();updPlayer();goView('library');updateStorage();toast('Данные очищены');
}

const fmt=s=>{if(!isFinite(s)||s<0)return'0:00';const m=Math.floor(s/60),x=Math.floor(s%60);return m+':'+String(x).padStart(2,'0')};
function toast(msg,warn){toastTxt.textContent=msg;toast.classList.toggle('warn',!!warn);toast.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>toast.classList.remove('show'),2800)}
const uid=p=>(p||'id')+'_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,8);
const updPlayIcon=()=>{playIcon.textContent=isPlaying?'pause':'play_arrow'};
const getTrack=id=>tracks.find(t=>t.id===id);
const listsFor=id=>playlists.filter(p=>(trackMap[p]||[]).includes(id));
function addToPl(id,p){if(!trackMap[p])trackMap[p]=[];if(!trackMap[p].includes(id)){trackMap[p].push(id);persist();return true}return false}
function removeFromPl(id,p){if(!trackMap[p])return false;const i=trackMap[p].indexOf(id);if(i>=0){trackMap[p].splice(i,1);persist();return true}return false}

function updCardVis(){
  document.querySelectorAll('.track-card').forEach(c=>{const i=+c.dataset.index;const cur=i===activeIdx;c.classList.toggle('current',cur);c.classList.toggle('playing',cur&&isPlaying)});
  document.querySelectorAll('.track-row').forEach(r=>{const i=+r.dataset.index;const cur=i===activeIdx;r.classList.toggle('current',cur);r.classList.toggle('playing',cur&&isPlaying)});
  updMinis();
}
function updMinis(){
  const dur=audio.duration||(activeIdx>=0?tracks[activeIdx]?.duration:0)||0;
  const pct=dur?Math.min(100,(audio.currentTime/dur)*100):0;
  document.querySelectorAll('.track-card').forEach(c=>{const i=+c.dataset.index;const f=c.querySelector('.mini-timeline-fill');if(f)f.style.width=(i===activeIdx)?pct+'%':'0%'});
  document.querySelectorAll('.track-row').forEach(r=>{const i=+r.dataset.index;const f=r.querySelector('.row-timeline-fill');if(f)f.style.width=(i===activeIdx)?pct+'%':'0%'});
}
function updPlayer(){
  if(activeIdx<0){nowT.textContent='Ничего не играет';nowA.textContent='—';totTime.textContent='0:00';curTime.textContent='0:00';tlFill.style.width='0%';vidBtn.classList.remove('active');return}
  const t=tracks[activeIdx];
  nowT.textContent=t.title;nowA.textContent=t.artist;
  totTime.textContent=fmt(t.duration||audio.duration||0);
  curTime.textContent=fmt(audio.currentTime||0);
  if(audio.duration&&isFinite(audio.duration))tlFill.style.width=Math.min(100,(audio.currentTime/audio.duration)*100)+'%';
  if(t.videoId){vidBtn.style.opacity='1';vidBtn.classList.toggle('active',drVideo.style.display!=='none'&&!!drVideo.src)}else{vidBtn.style.opacity='0.4';vidBtn.classList.remove('active')}
}

function setupAudioGraph(){
  if(audioCtx)return;
  try{audioCtx=new(window.AudioContext||window.webkitAudioContext)();audioSrc=audioCtx.createMediaElementSource(audio);gainNode=audioCtx.createGain();audioSrc.connect(gainNode);gainNode.connect(audioCtx.destination)}catch(e){audioCtx=null}
}
function applyVolume(){
  const eff=isMuted?0:volPct;
  if(eff<=100){audio.volume=eff/100;if(gainNode)gainNode.gain.value=1}
  else{if(!audioCtx)setupAudioGraph();audio.volume=1;if(gainNode)gainNode.gain.value=eff/100;if(audioCtx&&audioCtx.state==='suspended'&&isPlaying)audioCtx.resume().catch(()=>{})}
  volVal.textContent=isMuted?'mute':volPct+'%';
  volVal.classList.toggle('boost',!isMuted&&volPct>100);
  volSlider.value=volPct;
  volWrap.style.setProperty('--vol-fill',volPct);
  volWrap.classList.toggle('boost',!isMuted&&volPct>100);
  if(isMuted)volIcon.textContent='volume_off';
  else if(volPct===0)volIcon.textContent='volume_mute';
  else if(volPct<50)volIcon.textContent='volume_down';
  else volIcon.textContent='volume_up';
  localStorage.setItem(LS_VOL,String(volPct));localStorage.setItem(LS_MUTE,isMuted?'1':'0');
}
function ensureBoost(){if(volPct>100&&!isMuted){setupAudioGraph();if(audioCtx&&audioCtx.state==='suspended')audioCtx.resume().catch(()=>{})}}
volSlider.addEventListener('input',e=>{volPct=parseInt(e.target.value,10)||0;if(isMuted&&volPct>0)isMuted=false;applyVolume()});
volBtn.addEventListener('click',()=>{isMuted=!isMuted;if(!isMuted&&volPct===0)volPct=100;applyVolume()});
document.addEventListener('click',()=>{if(audioCtx&&audioCtx.state==='suspended')audioCtx.resume().catch(()=>{})},{passive:true});
document.addEventListener('touchstart',()=>{if(audioCtx&&audioCtx.state==='suspended')audioCtx.resume().catch(()=>{})},{passive:true});

function applyView(m){
  viewMode=m;localStorage.setItem(LS_VIEW,m);
  viewIcon.textContent=m==='list'?'view_list':'grid_view';
  viewLabel.textContent=m==='list'?'Список':'Плитка';
  document.querySelectorAll('.view-switcher-item').forEach(i=>i.classList.toggle('active',i.dataset.view===m));
  if(curView==='library'&&!settingsOpen)renderLibrary();
  else if(curView==='playlists'&&!settingsOpen)renderPlaylists();
}
viewBtn.addEventListener('click',e=>{e.stopPropagation();viewMenu.classList.toggle('open')});
document.addEventListener('click',e=>{if(!e.target.closest('#viewSwitcher'))viewMenu.classList.remove('open')});
document.querySelectorAll('.view-switcher-item').forEach(i=>i.addEventListener('click',()=>{viewMenu.classList.remove('open');applyView(i.dataset.view)}));
applyView(viewMode);

function updSR(){shufBtn.classList.toggle('active',shuffleMode);repBtn.classList.toggle('active',repeatMode)}
shufBtn.addEventListener('click',()=>{shuffleMode=!shuffleMode;localStorage.setItem(LS_SHUF,shuffleMode?'1':'0');updSR();toast(shuffleMode?'Перемешивание включено':'Перемешивание выключено')});
repBtn.addEventListener('click',()=>{repeatMode=!repeatMode;localStorage.setItem(LS_REP,repeatMode?'1':'0');updSR();toast(repeatMode?'Повтор трека включён':'Повтор трека выключен')});
updSR();

async function updateStorage(){
  try{
    let ac=0,vc=0,cc=0;const d=await openDB();
    await new Promise(r=>{const tx=d.transaction('audio','readonly');const q=tx.objectStore('audio').count();q.onsuccess=()=>{ac=q.result||0;r()};q.onerror=()=>r()});
    await new Promise(r=>{const tx=d.transaction('videos','readonly');const q=tx.objectStore('videos').count();q.onsuccess=()=>{vc=q.result||0;r()};q.onerror=()=>r()});
    await new Promise(r=>{const tx=d.transaction('covers','readonly');const q=tx.objectStore('covers').count();q.onsuccess=()=>{cc=q.result||0;r()};q.onerror=()=>r()});
    if(navigator.storage&&navigator.storage.estimate){
      const est=await navigator.storage.estimate();
      const u=(est.usage||0)/1048576,q=(est.quota||0)/1048576;
      storageUsed.textContent=u.toFixed(2)+' МБ / '+q.toFixed(0)+' МБ (аудио: '+ac+', клипы: '+vc+', обложки: '+cc+')';
      const p=q?Math.min(100,(u/q)*100):0;
      storageBar.style.width=p+'%';storageBar.style.background=p>85?'#ff6b6b':'var(--accent)';
    }else storageUsed.textContent='Аудио: '+ac+', клипы: '+vc+', обложки: '+cc;
  }catch(e){storageUsed.textContent='—'}
}

async function buildDD(t,idx){
  let h='<div class="dropdown-header">Добавить в плейлист</div>';
  playlists.forEach(p=>{const has=(trackMap[p]||[]).includes(t.id);h+='<button class="dropdown-item pl" data-add-pl="'+p.replace(/"/g,'&quot;')+'" data-track-index="'+idx+'"><span class="material-icons">'+(has?'check':'playlist_add')+'</span>'+p+'</button>'});
  if(!playlists.length)h+='<div style="padding:8px 14px;font-size:.7rem;color:var(--text-secondary)">Нет плейлистов</div>';
  h+='<div style="border-top:1px solid var(--border-light);margin:4px 0"></div>';
  h+='<button class="dropdown-item" data-details-index="'+idx+'"><span class="material-icons">info</span> Подробнее</button>';
  return h;
}
function attachMenus(root){
  root.querySelectorAll('.track-menu-btn,.row-menu-btn').forEach(b=>b.addEventListener('click',e=>{
    e.stopPropagation();const i=+b.dataset.menuIndex;
    if(isMobile()){if(mdOverlay.classList.contains('open')&&mobileMenuIdx===i){closeMD()}else openMD(i)}
    else{const dd=document.getElementById('dropdown-'+i);if(!dd)return;const wasOpen=dd.classList.contains('open');closeDD();if(!wasOpen)dd.classList.add('open')}
  }));
}
function attachDDs(root){
  root.querySelectorAll('.track-dropdown').forEach(dd=>dd.addEventListener('click',e=>{
    const it=e.target.closest('.dropdown-item');if(!it)return;e.stopPropagation();
    if(it.hasAttribute('data-add-pl')){
      const p=it.getAttribute('data-add-pl'),i=+it.dataset.trackIndex,t=tracks[i];
      if((trackMap[p]||[]).includes(t.id)){removeFromPl(t.id,p);toast('Удалено из «'+p+'»')}else{addToPl(t.id,p);toast('Добавлено в «'+p+'»')}
      closeDD();if(curView==='library')renderLibrary();if(curView==='playlists')renderPlaylists();
    }else if(it.hasAttribute('data-details-index')){closeDD();openDrawer(+it.dataset.detailsIndex)}
  }));
}
const closeDD=()=>document.querySelectorAll('.track-dropdown.open').forEach(d=>d.classList.remove('open'));
document.addEventListener('click',e=>{if(!e.target.closest('.track-dropdown')&&!e.target.closest('.track-menu-btn')&&!e.target.closest('.row-menu-btn'))closeDD()});

function buildMD(idx){
  const t=tracks[idx];if(!t)return'';
  let h='<div class="mobile-dropdown-title">'+t.title+'</div>';
  if(playlists.length){
    h+='<div class="dropdown-header">Добавить в плейлист</div>';
    playlists.forEach(p=>{const has=(trackMap[p]||[]).includes(t.id);h+='<button class="dropdown-item pl" data-add-pl="'+p.replace(/"/g,'&quot;')+'" data-track-index="'+idx+'"><span class="material-icons">'+(has?'check':'playlist_add')+'</span>'+p+'</button>'});
  }
  h+='<div style="border-top:1px solid var(--border-light);margin:6px 0"></div>';
  h+='<button class="dropdown-item" data-details-index="'+idx+'"><span class="material-icons">info</span> Подробнее</button>';
  h+='<button class="dropdown-item" data-cover-index="'+idx+'"><span class="material-icons">image</span> Загрузить обложку</button>';
  return h;
}
function openMD(i){mobileMenuIdx=i;mdContent.innerHTML=buildMD(i);mdOverlay.classList.add('open')}
function closeMD(){mdOverlay.classList.remove('open');mobileMenuIdx=-1}
mdOverlay.addEventListener('click',e=>{if(e.target===mdOverlay)closeMD()});
mdContent.addEventListener('click',e=>{
  const it=e.target.closest('.dropdown-item');if(!it)return;e.stopPropagation();
  if(it.hasAttribute('data-add-pl')){
    const p=it.getAttribute('data-add-pl'),i=+it.dataset.trackIndex,t=tracks[i];
    if((trackMap[p]||[]).includes(t.id)){removeFromPl(t.id,p);toast('Удалено из «'+p+'»')}else{addToPl(t.id,p);toast('Добавлено в «'+p+'»')}
    mdContent.innerHTML=buildMD(i);
    if(curView==='library')renderLibrary();if(curView==='playlists')renderPlaylists();
  }else if(it.hasAttribute('data-details-index')){closeMD();openDrawer(+it.dataset.detailsIndex)}
  else if(it.hasAttribute('data-cover-index')){closeMD();triggerCover(+it.dataset.coverIndex)}
});

function triggerCover(i){pendingCoverIdx=i;coverInput.value='';coverInput.click()}
coverInput.addEventListener('change',async e=>{
  const f=e.target.files&&e.target.files[0];
  if(!f||!f.type.startsWith('image/')){if(f)toast('Выберите изображение');coverInput.value='';return}
  const i=pendingCoverIdx;if(i<0||i>=tracks.length){coverInput.value='';return}
  if(f.size>MAX_COVER*1048576){toast('Обложка слишком большая');coverInput.value='';return}
  const t=tracks[i],cId=uid('c'),r=await saveCover(cId,f);
  if(!r.ok){toast('Не удалось сохранить обложку');coverInput.value='';return}
  if(t.coverId)await delCover(t.coverId);
  t.coverId=cId;t.coverMime=f.type;
  const u=URL.createObjectURL(f);urls['c_'+cId]=u;coverCache[t.id]=u;
  persist();toast('Обложка установлена');
  if(curView==='library')renderLibrary();if(curView==='playlists')renderPlaylists();
  if(detailIdx===i)await refreshDrawer(i);
  updateStorage();coverInput.value='';pendingCoverIdx=-1;
});

async function renderCoverInto(el,t){
  const u=await getCoverUrl(t);

async function attachHandlers(root){
  root.querySelectorAll('.track-cover,.row-cover').forEach(el=>{
    const idx=+el.dataset.playIndex;
    if(!isNaN(idx)&&tracks[idx])renderCoverInto(el,tracks[idx]);
  });
  root.querySelectorAll('.track-cover,.row-cover').forEach(c=>c.addEventListener('click',e=>{
    if(e.target.closest('.cover-upload-btn'))return;
    e.stopPropagation();playTrack(+c.dataset.playIndex,true);
  }));
  root.querySelectorAll('.cover-upload-btn').forEach(b=>b.addEventListener('click',e=>{e.stopPropagation();triggerCover(+b.dataset.coverUploadIndex)}));
  root.querySelectorAll('.track-title,.row-info').forEach(el=>el.addEventListener('click',e=>{
    e.stopPropagation();openDrawer(+el.dataset.detailIndex);
  }));
  attachMenus(root);attachDDs(root);
  updMinis();
}

function shuffled(current){
  if(tracks.length<=1)return current;
  const cand=[];for(let i=0;i<tracks.length;i++)if(i!==current)cand.push(i);
  return cand.length?cand[Math.floor(Math.random()*cand.length)]:current;
}
async function playTrack(i,auto=true){
  if(i<0||i>=tracks.length)return;
  const t=tracks[i];
  const url=await getAudioUrl(t);
  if(!url){toast('Аудиофайл не найден');return}
  if(activeIdx===i){
    if(auto){
      if(isPlaying){audio.pause();isPlaying=false}
      else{ensureBoost();audio.play().then(()=>{isPlaying=true;updPlayIcon();updCardVis();if(t.videoId){hardSync();if(drVideo.style.display!=='none'&&drVideo.src){try{drVideo.currentTime=audio.currentTime}catch(e){};drVideo.play().catch(()=>{})}}}).catch(()=>{isPlaying=false;updPlayIcon();updCardVis()})}
    }
    updCardVis();updPlayer();return;
  }
  activeIdx=i;isPlaying=false;audio.src=url;audio.load();
  nowT.textContent=t.title;nowA.textContent=t.artist;
  totTime.textContent=fmt(t.duration||0);curTime.textContent='0:00';tlFill.style.width='0%';
  const vUrl=await getVideoUrl(t);
  if(vUrl){videoEl.src=vUrl;videoEl.load();videoEl.muted=true}else{videoEl.removeAttribute('src');videoEl.load()}
  if(dr.classList.contains('open')){detailIdx=i;await refreshDrawer(i)}
  if(auto){ensureBoost();audio.play().then(()=>{isPlaying=true;updPlayIcon();updCardVis();if(vUrl){videoEl.currentTime=0;hardSync();if(drVideo.style.display!=='none'&&drVideo.src){try{drVideo.currentTime=0}catch(e){};drVideo.play().catch(()=>{})}}}).catch(()=>{isPlaying=false;updPlayIcon();updCardVis()})}
  else{updPlayIcon();updCardVis()}
  updPlayer();
}
function nextTrack(auto){
  if(!tracks.length)return;
  if(repeatMode&&auto&&activeIdx>=0){audio.currentTime=0;ensureBoost();audio.play().then(()=>{isPlaying=true;updPlayIcon();updCardVis()}).catch(()=>{});return}
  const n=shuffleMode?shuffled(activeIdx):(activeIdx+1)%tracks.length;
  playTrack(n,true);
}
function prevTrack(){
  if(!tracks.length)return;
  const n=shuffleMode?shuffled(activeIdx):(activeIdx-1+tracks.length)%tracks.length;
  playTrack(n,true);
}
async function hardSync(){
  if(activeIdx<0)return;const t=tracks[activeIdx];if(!t.videoId)return;
  const u=await getVideoUrl(t);if(!u)return;
  if(videoEl.src!==u){videoEl.src=u;videoEl.load()}
  videoEl.muted=true;
  try{if(Math.abs(videoEl.currentTime-audio.currentTime)>0.05)videoEl.currentTime=audio.currentTime}catch(e){}
}
async function syncSeek(){
  if(activeIdx<0)return;const t=tracks[activeIdx];if(!t.videoId)return;
  const u=await getVideoUrl(t);if(!u)return;
  if(videoEl.src!==u){videoEl.src=u;videoEl.load()}
  try{videoEl.currentTime=audio.currentTime||0}catch(e){}
  if(isPlaying)videoEl.play().catch(()=>{});else videoEl.pause();
}
audio.addEventListener('timeupdate',()=>{
  if(activeIdx<0)return;const t=tracks[activeIdx];
  if(t.videoId&&videoEl.src&&Math.abs(videoEl.currentTime-audio.currentTime)>0.15){try{videoEl.currentTime=audio.currentTime}catch(e){}}
  if(drVideo.style.display!=='none'&&drVideo.src&&t.videoId&&Math.abs(drVideo.currentTime-audio.currentTime)>0.2){try{drVideo.currentTime=audio.currentTime}catch(e){}}
  const dur=audio.duration||t.duration||0;
  curTime.textContent=fmt(audio.currentTime);
  if(dur)tlFill.style.width=Math.min(100,(audio.currentTime/dur)*100)+'%';
  updMinis();
});
audio.addEventListener('loadedmetadata',()=>{
  if(activeIdx<0)return;const t=tracks[activeIdx];
  if(isFinite(audio.duration)&&audio.duration>0){t.duration=audio.duration;totTime.textContent=fmt(audio.duration);persist()}
});
audio.addEventListener('play',()=>{
  isPlaying=true;updPlayIcon();updCardVis();
  if(activeIdx>=0&&tracks[activeIdx].videoId){hardSync();if(drVideo.style.display!=='none'&&drVideo.src){try{drVideo.currentTime=audio.currentTime}catch(e){};drVideo.play().catch(()=>{})}}
});
audio.addEventListener('pause',()=>{
  isPlaying=false;updPlayIcon();updCardVis();videoEl.pause();
  if(drVideo.style.display!=='none')drVideo.pause();
});
audio.addEventListener('seeking',syncSeek);
audio.addEventListener('seeked',syncSeek);
audio.addEventListener('ended',()=>{isPlaying=false;updPlayIcon();updCardVis();videoEl.pause();if(tracks.length)nextTrack(true)});

function seekTo(clientX){
  if(activeIdx<0)return;const t=tracks[activeIdx];const dur=audio.duration||t.duration||0;if(!dur)return;
  const rect=tlTrack.getBoundingClientRect();const x=clientX-rect.left;const p=Math.max(0,Math.min(1,x/rect.width));const nt=p*dur;
  if(audio.src)audio.currentTime=nt;
  if(t.videoId&&videoEl.src){try{videoEl.currentTime=nt}catch(e){}}
  if(drVideo.style.display!=='none'&&drVideo.src&&t.videoId){try{drVideo.currentTime=nt}catch(e){}}
  curTime.textContent=fmt(nt);tlFill.style.width=(p*100)+'%';updMinis();
}
tlTrack.addEventListener('click',e=>seekTo(e.clientX));
let tlDrag=false;
tlTrack.addEventListener('touchstart',e=>{tlDrag=true;if(e.touches[0])seekTo(e.touches[0].clientX)},{passive:true});
tlTrack.addEventListener('touchmove',e=>{if(tlDrag&&e.touches[0])seekTo(e.touches[0].clientX)},{passive:true});
tlTrack.addEventListener('touchend',()=>{tlDrag=false});

vidBtn.addEventListener('click',async()=>{
  if(activeIdx<0)return;const t=tracks[activeIdx];
  if(!t.videoId){toast('У этого трека нет клипа');return}
  if(drVideo.style.display!=='none'&&drVideo.src){
    drVideo.pause();drVideo.style.display='none';drVideo.removeAttribute('src');drVideo.load();
    vidBtn.classList.remove('active');updPlayer();return;
  }

    const u=await getVideoUrl(t);
    if(u){drVideo.src=u;drVideo.style.display='block';drVideo.muted=true;try{drVideo.currentTime=audio.currentTime}catch(e){};if(isPlaying)drVideo.play().catch(()=>{});else drVideo.pause();vidBtn.classList.add('active');updPlayer()}
  },120);
});

uploadBtn.addEventListener('click',()=>fileInput.click());
fileInput.addEventListener('change',async e=>{
  const files=Array.from(e.target.files||[]);if(!files.length)return;
  let ok=0,fail=0;
  for(const f of files){
    if(!f.type.startsWith('audio/')&&!/\.(mp3|m4a|aac|ogg|wav|flac|opus|wma|webm|oga)$/i.test(f.name)){fail++;continue}
    if(f.size>MAX_AUDIO*1048576){fail++;continue}
    const id=uid('a');const saved=await saveAudio(id,f);
    if(!saved){fail++;continue}
    const url=URL.createObjectURL(f);urls['a_'+id]=url;
    const meta=await readMeta(url);
    tracks.push({id:uid('t'),title:f.name.replace(/\.[^.]+$/,''),artist:'Неизвестный исполнитель',album:'—',duration:meta.duration||0,format:(f.type.split('/')[1]||'—').toUpperCase(),mime:f.type||'audio/mpeg',audioId:id,videoId:null,videoMime:null,videoDuration:0,coverId:null,coverMime:null,_originalName:f.name,_originalSize:f.size,_lastModified:f.lastModified});
    ok++;
  }
  fileInput.value='';persist();toast('Добавлено: '+ok+(fail?', ошибок: '+fail:''));
  if(curView==='library')renderLibrary();else goView('library');updateStorage();
});
function readMeta(url){return new Promise(res=>{const a=new Audio();a.preload='metadata';a.src=url;const done=()=>{const d=(isFinite(a.duration)&&a.duration>0)?a.duration:0;a.src='';res({duration:d})};a.addEventListener('loadedmetadata',done,{once:true});a.addEventListener('error',done,{once:true});setTimeout(()=>{if(!a.duration)res({duration:0})},2500)})}

async function refreshDrawer(i){
  if(i<0||i>=tracks.length)return;const t=tracks[i];
  dTitle.textContent=t.title;dArtist.textContent=t.artist||'Неизвестный исполнитель';dAlbum.textContent=t.album||'—';
  dDur.textContent=fmt(t.duration||0);dFmt.textContent=t.format||'—';
  const ls=listsFor(t.id);dPl.textContent=ls.length?ls.join(', '):'Не добавлен ни в один';
  const cu=await getCoverUrl(t);
  if(cu){drCoverImg.src=cu;drCoverImg.style.display='block';drCover.querySelector('.material-icons').style.display='none'}
  else{drCoverImg.style.display='none';drCover.querySelector('.material-icons').style.display=''}
  if(t.videoId){
    const u=await getVideoUrl(t);
    if(u){
      drVideo.style.display='block';if(drVideo.src!==u){drVideo.src=u;drVideo.load()}
      drVideo.muted=true;try{drVideo.currentTime=audio.currentTime}catch(e){}
      if(isPlaying)drVideo.play().catch(()=>{});else drVideo.pause();
      let warn='';
      if(t.videoDuration&&t.duration){const diff=Math.abs(t.videoDuration-t.duration);if(diff>CLIP_TOL)warn='<div class="video-warning"><span class="material-icons">warning</span><span>Длительность клипа ('+fmt(t.videoDuration)+') отличается от песни ('+fmt(t.duration)+') более чем на '+CLIP_TOL+' секунд.</span></div>'}
      dVidBox.innerHTML='<div class="video-status"><span class="material-icons">videocam</span> Клип загружен <button class="remove-video-btn" id="removeVideoBtn">Удалить</button></div>'+warn;
      const rb=document.getElementById('removeVideoBtn');
      if(rb)rb.addEventListener('click',async()=>{await delVideo(t.videoId);t.videoId=null;t.videoMime=null;t.videoDuration=0;videoEl.removeAttribute('src');videoEl.load();drVideo.removeAttribute('src');drVideo.load();persist();refreshDrawer(i);toast('Клип удалён');if(curView==='library')renderLibrary();updPlayer();updateStorage()});
    }else{t.videoId=null;t.videoDuration=0;persist();refreshDrawer(i)}
  }else{
    drVideo.style.display='none';drVideo.removeAttribute('src');drVideo.load();
    dVidBox.innerHTML='<button class="upload-video-btn" id="uploadVideoBtnInner"><span class="material-icons">video_call</span> Загрузить клип</button>';
    const ib=document.getElementById('uploadVideoBtnInner');
    if(ib)ib.addEventListener('click',()=>vidInput.click());
  }
}

upVidBtn.addEventListener('click',()=>vidInput.click());
vidInput.addEventListener('change',async e=>{
  const f=e.target.files&&e.target.files[0];
  if(!f||!f.type.startsWith('video/')){toast('Выберите видео-файл');vidInput.value='';return}
  if(detailIdx<0)return;
  if(f.size>MAX_VIDEO*1048576){toast('Клип слишком большой');vidInput.value='';return}
  const t=tracks[detailIdx],vId=uid('v');
  toast('Сохранение клипа...');
  const r=await saveVideo(vId,f);
  if(!r.ok){toast('Не удалось сохранить');vidInput.value='';return}
  const vUrl=URL.createObjectURL(f);
  const dur=await new Promise(res=>{const v=document.createElement('video');v.preload='metadata';v.src=vUrl;v.onloadedmetadata=()=>res((isFinite(v.duration)&&v.duration>0)?v.duration:0);v.onerror=()=>res(0);setTimeout(()=>{if(!v.duration)res(0)},3000)});
  if(t.videoId)await delVideo(t.videoId);
  t.videoId=vId;t.videoMime=f.type;t.videoDuration=dur;
  urls['v_'+vId]=vUrl;videoEl.src=vUrl;videoEl.load();videoEl.muted=true;
  persist();toast('Клип загружен');await refreshDrawer(detailIdx);vidInput.value='';
  if(t.duration&&dur&&Math.abs(dur-t.duration)>CLIP_TOL)toast('Внимание: длительность клипа ('+fmt(dur)+') отличается от песни ('+fmt(t.duration)+') более чем на '+CLIP_TOL+' секунд',true);
  if(curView==='library')renderLibrary();updPlayer();updateStorage();
});

function updNav(v){
  libBtn.classList.toggle('active',v==='library');
  plBtn.classList.toggle('active',v==='playlists');
  if(mLibBtn)mLibBtn.classList.toggle('active',v==='library');
  if(mPlBtn)mPlBtn.classList.toggle('active',v==='playlists');
  if(mSetBtn)mSetBtn.classList.remove('active');
}
function showSettings(){
  titleEl.textContent='Настройки';settingsPanel.classList.add('visible');settingsOpen=true;
  content.innerHTML='';headerActions.style.display='none';
  libBtn.classList.remove('active');plBtn.classList.remove('active');
  if(mLibBtn)mLibBtn.classList.remove('active');
  if(mPlBtn)mPlBtn.classList.remove('active');
  if(mSetBtn)mSetBtn.classList.add('active');
  updateStorage();
}
function goView(v){
  curView=v;settingsPanel.classList.remove('visible');settingsOpen=false;expPlaylist=null;closeDD();closeMD();
  if(v==='library'){updNav('library');headerActions.style.display='flex';renderLibrary()}
  else{updNav('playlists');headerActions.style.display='flex';renderPlaylists()}
}
libBtn.addEventListener('click',()=>goView('library'));
plBtn.addEventListener('click',()=>goView('playlists'));
setBtn.addEventListener('click',()=>{if(settingsOpen)goView(curView);else showSettings()});
if(mLibBtn)mLibBtn.addEventListener('click',()=>goView('library'));
if(mPlBtn)mPlBtn.addEventListener('click',()=>goView('playlists'));
if(mSetBtn)mSetBtn.addEventListener('click',()=>{if(settingsOpen)goView(curView);else showSettings()});
clearBtn.addEventListener('click',()=>{if(confirm('Удалить все сохранённые треки, клипы и плейлисты?'))clearAll()});

const accentPick=$('accentColorPicker'),bgPick=$('bgColorPicker'),darkBtn=$('darkThemeBtn'),lightBtn=$('lightThemeBtn');
darkBtn.addEventListener('click',()=>{
  const s=document.documentElement.style;
  s.setProperty('--bg-primary','#0f0f12');s.setProperty('--bg-secondary','#1a1a1f');s.setProperty('--bg-elevated','#25252c');
  s.setProperty('--text-primary','#efeff1');s.setProperty('--text-secondary','#b0b0b8');s.setProperty('--border-light','#2e2e36');
  bgPick.value='#0f0f12';darkBtn.classList.add('active');lightBtn.classList.remove('active');
});
lightBtn.addEventListener('click',()=>{
  const s=document.documentElement.style;
  s.setProperty('--bg-primary','#f4f4f8');s.setProperty('--bg-secondary','#ffffff');s.setProperty('--bg-elevated','#eaeaf0');
  s.setProperty('--text-primary','#1e1e24');s.setProperty('--text-secondary','#5a5a66');s.setProperty('--border-light','#d0d0dc');
  bgPick.value='#f4f4f8';lightBtn.classList.add('active');darkBtn.classList.remove('active');
});
accentPick.addEventListener('input',e=>{document.documentElement.style.setProperty('--accent',e.target.value);document.documentElement.style.setProperty('--accent-soft',e.target.value+'cc')});
bgPick.addEventListener('input',e=>{
  const c=e.target.value;
  const adj=(hex,p)=>{let r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);r=Math.min(255,Math.max(0,r+p));g=Math.min(255,Math.max(0,g+p));b=Math.min(255,Math.max(0,b+p));return '#'+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1)};
  const r=parseInt(c.slice(1,3),16),g=parseInt(c.slice(3,5),16),b=parseInt(c.slice(5,7),16);
  const lum=(0.299*r+0.587*g+0.114*b)/255;
  let sec,elev,bord,tp,ts;
  if(lum<0.5){sec=adj(c,20);elev=adj(c,40);bord=adj(c,60);tp='#efeff1';ts='#b0b0b8'}
  else{sec=adj(c,-10);elev=adj(c,-25);bord=adj(c,-35);tp='#1e1e24';ts='#5a5a66'}
  const s=document.documentElement.style;
  s.setProperty('--bg-primary',c);s.setProperty('--bg-secondary',sec);s.setProperty('--bg-elevated',elev);
  s.setProperty('--border-light',bord);s.setProperty('--text-primary',tp);s.setProperty('--text-secondary',ts);
  if(lum<0.5){darkBtn.classList.add('active');lightBtn.classList.remove('active')}
  else{lightBtn.classList.add('active');darkBtn.classList.remove('active')}
});

(async function(){
  document.documentElement.style.setProperty('--accent-soft','#2a5a9e');
  const ov=document.createElement('div');ov.className='loading-overlay';ov.innerHTML='<div class="spinner"></div><span>Загрузка MzMusic...</span>';document.body.appendChild(ov);
  try{await openDB()}catch(e){}
  const loaded=await loadState();
  applyVolume();
  goView('library');
  updPlayIcon();updPlayer();await updateStorage();
  ov.remove();
  if(loaded&&tracks.length)toast('MzMusic: загружено '+tracks.length+' треков');
})();

document.querySelectorAll('.player-ctrl-btn,.nav-btn,.mobile-nav-btn,.settings-btn,.cover-play,.timeline-track').forEach(el=>el.addEventListener('touchstart',()=>{},{passive:true}));
})();
</script>
</body>
