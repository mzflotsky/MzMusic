<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0f0f12">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <title>MzMusic</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        :root {
            --bg-primary: #0f0f12;
            --bg-secondary: #1a1a1f;
            --bg-elevated: #25252c;
            --text-primary: #efeff1;
            --text-secondary: #b0b0b8;
            --accent: #4f9eff;
            --accent-soft: #2a5a9e;
            --border-light: #2e2e36;
            --shadow: 0 8px 20px rgba(0, 0, 0, 0.6);
            --radius-card: 16px;
            --transition: all 0.2s ease;
            --font-mono: 'JetBrains Mono', monospace;
            --safe-top: env(safe-area-inset-top, 0px);
            --safe-bottom: env(safe-area-inset-bottom, 0px);
            --safe-left: env(safe-area-inset-left, 0px);
            --safe-right: env(safe-area-inset-right, 0px);
            --mobile-nav-height: 60px;
        }

        html, body { height: 100%; overflow: hidden; overscroll-behavior: none; }

        body {
            font-family: var(--font-mono);
            background-color: var(--bg-primary);
            color: var(--text-primary);
            display: flex;
            transition: background-color 0.2s, color 0.2s;
            -webkit-font-smoothing: antialiased;
        }

        .sidebar {
            width: 86px;
            background: var(--bg-secondary);
            border-right: 1px solid var(--border-light);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 24px 0;
            padding-top: calc(24px + var(--safe-top));
            padding-bottom: calc(24px + var(--safe-bottom));
            flex-shrink: 0;
            height: 100vh;
            height: 100dvh;
            z-index: 20;
        }

        .sidebar-top {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 32px;
            width: 100%;
        }

        .brand {
            font-size: 1.05rem;
            font-weight: 700;
            letter-spacing: -0.6px;
            color: var(--accent);
            text-align: center;
            line-height: 1.1;
            padding: 0 4px;
            user-select: none;
        }

        .brand span { color: var(--text-primary); }

        .nav-btn {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            width: 52px;
            height: 52px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
        }

        .nav-btn .material-icons { font-size: 28px; }
        .nav-btn:hover { background: var(--bg-elevated); color: var(--text-primary); }
        .nav-btn.active { background: var(--accent-soft); color: white; }

        .sidebar-bottom {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }

        .social-links {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }

        .social-link {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            border-radius: 12px;
            color: var(--text-secondary);
            text-decoration: none;
            transition: var(--transition);
        }

        .social-link:hover { color: var(--accent); transform: translateY(-1px); }
        .social-link svg { width: 18px; height: 18px; fill: currentColor; }

        .settings-btn {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            width: 52px;
            height: 52px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: color 0.2s ease, transform 0.2s ease;
        }

        .settings-btn:hover { background: transparent; color: var(--accent); transform: rotate(30deg); }
        .settings-btn .material-icons { font-size: 26px; }

        .main {
            flex: 1;
            height: 100vh;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            background: var(--bg-primary);
            overflow: hidden;
            position: relative;
            min-width: 0;
        }

        .main-scroll {
            flex: 1;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            padding: 28px 36px 20px 36px;
            padding-top: calc(28px + var(--safe-top));
            display: flex;
            flex-direction: column;
            gap: 24px;
            min-height: 0;
        }

        .main-scroll::-webkit-scrollbar { width: 8px; }
        .main-scroll::-webkit-scrollbar-track { background: var(--bg-primary); }
        .main-scroll::-webkit-scrollbar-thumb { background: var(--border-light); border-radius: 8px; }

        .page-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 16px;
        }

        .page-title {
            font-size: 1.8rem;
            font-weight: 600;
            letter-spacing: -0.5px;
            color: var(--text-primary);
        }

        .header-actions { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }

        .upload-btn {
            background: var(--bg-elevated);
            border: 1px solid var(--border-light);
            color: var(--text-primary);
            padding: 10px 18px;
            border-radius: 40px;
            font-family: var(--font-mono);
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.85rem;
        }

        .upload-btn:hover { background: var(--accent-soft); border-color: var(--accent); color: white; }
        .upload-btn.primary-scan { background: var(--accent-soft); border-color: var(--accent); color: white; }
        .upload-btn.primary-scan:hover { background: var(--accent); }

        .track-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 14px;
        }

        .track-card {
            background: var(--bg-secondary);
            border-radius: var(--radius-card);
            border: 1px solid var(--border-light);
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            transition: var(--transition);
            position: relative;
            overflow: visible;
        }

        .track-card:hover { background: var(--bg-elevated); border-color: var(--accent-soft); transform: translateY(-2px); }
        .track-card.current { border-color: var(--accent); background: var(--bg-elevated); }

        .track-cover {
            width: 100%;
            aspect-ratio: 1 / 1;
            border-radius: 12px;
            background: linear-gradient(135deg, var(--accent-soft), var(--bg-elevated));
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
            cursor: pointer;
        }

        .track-cover .cover-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            inset: 0;
        }

        .track-cover .cover-icon {
            font-size: 48px;
            opacity: 0.35;
            color: var(--text-secondary);
            transition: opacity 0.2s;
        }

        .track-cover.has-custom .cover-icon { display: none; }

        .track-card:hover .track-cover .cover-icon { opacity: 0.15; }

        .cover-play {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: transparent;
            opacity: 0;
            transition: opacity 0.2s;
            cursor: pointer;
            z-index: 2;
        }

        .track-card:hover .cover-play,
        .track-card.current .cover-play { opacity: 1; }

        .cover-play .play-icon {
            font-size: 64px;
            color: white;
            filter: drop-shadow(0 2px 12px rgba(0,0,0,0.6));
            transition: transform 0.15s ease;
            line-height: 1;
        }

        .cover-play:hover .play-icon { transform: scale(1.12); }

        .track-card.current .cover-play .play-icon::before { content: 'play_arrow'; }
        .track-card.current.playing .cover-play .play-icon::before { content: 'pause'; }

        .cover-upload-btn {
            position: absolute;
            bottom: 8px;
            left: 8px;
            width: 32px;
            height: 32px;
            border-radius: 10px;
            background: rgba(15, 15, 18, 0.75);
            border: 1px solid var(--border-light);
            color: var(--text-primary);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 4;
            transition: var(--transition);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            padding: 0;
        }

        .cover-upload-btn:hover { background: var(--accent); border-color: var(--accent); color: white; }
        .cover-upload-btn .material-icons { font-size: 16px; }

        .track-meta { display: flex; flex-direction: column; gap: 3px; min-width: 0; padding-right: 36px; }

        .track-title {
            font-weight: 600;
            font-size: 0.9rem;
            color: var(--text-primary);
            letter-spacing: -0.2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            cursor: pointer;
            transition: color 0.15s;
        }

        .track-title:hover { color: var(--accent); text-decoration: underline; text-underline-offset: 3px; }

        .track-artist {
            font-size: 0.72rem;
            color: var(--text-secondary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .track-footer { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }

        .track-badge {
            font-size: 0.65rem;
            padding: 3px 8px;
            background: var(--bg-elevated);
            border-radius: 30px;
            color: var(--text-secondary);
            border: 1px solid var(--border-light);
        }

        .video-badge {
            display: inline-flex;
            align-items: center;
            gap: 3px;
            font-size: 0.6rem;
            color: var(--accent);
            background: var(--bg-primary);
            border: 1px solid var(--accent-soft);
            border-radius: 20px;
            padding: 2px 8px;
        }

        .video-badge .material-icons { font-size: 12px; }

        .mini-timeline {
            display: none;
            width: 100%;
            height: 4px;
            border-radius: 2px;
            background: var(--bg-primary);
            position: relative;
            overflow: hidden;
            margin-top: 2px;
        }

        .track-card.current .mini-timeline { display: block; }

        .mini-timeline-fill {
            height: 100%;
            width: 0%;
            background: var(--accent);
            border-radius: 2px;
            transition: width 0.15s linear;
        }

        .track-menu-btn {
            position: absolute;
            top: 22px;
            right: 22px;
            width: 32px;
            height: 32px;
            border-radius: 10px;
            background: rgba(15, 15, 18, 0.75);
            border: 1px solid var(--border-light);
            color: var(--text-primary);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 3;
            transition: var(--transition);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
        }

        .track-menu-btn:hover { background: var(--accent); border-color: var(--accent); color: white; }
        .track-menu-btn .material-icons { font-size: 18px; }

        .track-dropdown {
            position: absolute;
            top: 58px;
            right: 22px;
            background: var(--bg-elevated);
            border: 1px solid var(--border-light);
            border-radius: 12px;
            box-shadow: var(--shadow);
            z-index: 100;
            min-width: 220px;
            max-width: 90vw;
            padding: 6px;
            display: none;
        }

        .track-dropdown.open { display: block; }

        .dropdown-item {
            padding: 10px 14px;
            font-size: 0.8rem;
            color: var(--text-primary);
            cursor: pointer;
            border-radius: 8px;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: var(--transition);
            background: transparent;
            border: none;
            width: 100%;
            text-align: left;
            font-family: var(--font-mono);
        }

        .dropdown-item:hover { background: var(--bg-primary); }
        .dropdown-item .material-icons { font-size: 16px; color: var(--accent); }
        .dropdown-item.pl { padding-left: 32px; font-size: 0.78rem; }
        .dropdown-item.pl .material-icons { font-size: 14px; }
        .dropdown-header {
            padding: 8px 14px 4px 14px;
            font-size: 0.6rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .settings-panel {
            display: none;
            flex-direction: column;
            gap: 30px;
            background: var(--bg-secondary);
            padding: 30px;
            border-radius: var(--radius-card);
            border: 1px solid var(--border-light);
        }

        .settings-panel.visible { display: flex; }

        .settings-group { display: flex; flex-direction: column; gap: 12px; }
        .settings-group label { font-weight: 500; color: var(--text-primary); letter-spacing: -0.2px; }

        .color-row { display: flex; gap: 16px; flex-wrap: wrap; align-items: center; }

        .color-input {
            display: flex;
            align-items: center;
            gap: 10px;
            background: var(--bg-elevated);
            padding: 8px 16px;
            border-radius: 40px;
            border: 1px solid var(--border-light);
        }

        .color-input input[type="color"] {
            width: 44px;
            height: 44px;
            border: none;
            background: transparent;
            cursor: pointer;
            border-radius: 12px;
        }

        .theme-toggle { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }

        .theme-btn {
            background: var(--bg-elevated);
            border: 1px solid var(--border-light);
            color: var(--text-primary);
            padding: 12px 22px;
            border-radius: 40px;
            font-family: var(--font-mono);
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .theme-btn.active { border-color: var(--accent); background: var(--accent-soft); color: white; }

        .settings-note { opacity: 0.7; font-size: 0.9rem; }

        .storage-info {
            font-size: 0.8rem;
            color: var(--text-secondary);
            background: var(--bg-elevated);
            padding: 12px 16px;
            border-radius: 12px;
            border: 1px solid var(--border-light);
            line-height: 1.6;
        }

        .storage-info .storage-bar {
            height: 8px;
            border-radius: 4px;
            background: var(--bg-primary);
            margin-top: 8px;
            overflow: hidden;
        }

        .storage-info .storage-bar-fill {
            height: 100%;
            background: var(--accent);
            border-radius: 4px;
            transition: width 0.3s ease;
        }

        .clear-storage-btn {
            background: transparent;
            border: 1px solid #ff6b6b;
            color: #ff6b6b;
            padding: 10px 20px;
            border-radius: 40px;
            font-family: var(--font-mono);
            font-size: 0.8rem;
            cursor: pointer;
            transition: var(--transition);
            align-self: flex-start;
        }

        .clear-storage-btn:hover { background: rgba(255,107,107,0.1); }

        .playlist-section { display: flex; flex-direction: column; gap: 20px; }

        .custom-input-row {
            display: flex;
            align-items: center;
            gap: 12px;
            background: var(--bg-secondary);
            padding: 8px 8px 8px 24px;
            border-radius: 60px;
            border: 1px solid var(--border-light);
            max-width: 500px;
        }

        .custom-input-row input {
            background: transparent;
            border: none;
            color: var(--text-primary);
            font-family: var(--font-mono);
            font-size: 1rem;
            padding: 14px 6px;
            outline: none;
            flex: 1;
            min-width: 0;
        }

        .custom-input-row input::placeholder { color: var(--text-secondary); opacity: 0.7; }

        .create-playlist-btn {
            background: var(--accent);
            border: none;
            color: white;
            padding: 14px 24px;
            border-radius: 40px;
            font-family: var(--font-mono);
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 8px;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .create-playlist-btn:hover { background: var(--accent-soft); }

        .playlist-chips { display: flex; flex-wrap: wrap; gap: 10px; }

        .playlist-chip {
            background: var(--bg-elevated);
            border: 1px solid var(--border-light);
            padding: 10px 20px;
            border-radius: 40px;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            transition: var(--transition);
            user-select: none;
        }

        .playlist-chip:hover { border-color: var(--accent); background: var(--bg-secondary); transform: translateY(-1px); }
        .playlist-chip .material-icons { font-size: 18px; color: var(--accent); }
        .playlist-chip.expanded { border-color: var(--accent); background: var(--bg-secondary); }

        .playlist-tracks {
            display: none;
            flex-direction: column;
            gap: 8px;
            padding: 16px;
            background: var(--bg-secondary);
            border-radius: var(--radius-card);
            border: 1px solid var(--border-light);
        }

        .playlist-tracks.visible { display: flex; }

        .playlist-track-row {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 14px;
            border-radius: 10px;
            background: var(--bg-elevated);
            cursor: pointer;
            transition: var(--transition);
        }

        .playlist-track-row:hover { background: var(--bg-primary); }
        .playlist-track-row .material-icons { font-size: 18px; color: var(--accent); }
        .playlist-track-row .pl-title { font-size: 0.85rem; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .playlist-track-row .pl-artist {
            font-size: 0.7rem;
            color: var(--text-secondary);
            margin-left: auto;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 40%;
        }

        .player-bar {
            flex-shrink: 0;
            background: var(--bg-secondary);
            border-top: 1px solid var(--border-light);
            padding: 14px 28px;
            padding-bottom: calc(14px + var(--safe-bottom));
            display: flex;
            align-items: center;
            gap: 20px;
            z-index: 55;
        }

        .player-controls { display: flex; align-items: center; gap: 6px; }

        .player-ctrl-btn {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            width: 40px;
            height: 40px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
        }

        .player-ctrl-btn:hover { background: var(--bg-elevated); color: var(--text-primary); }

        .player-info {
            display: flex;
            flex-direction: column;
            gap: 2px;
            min-width: 160px;
            max-width: 220px;
            cursor: pointer;
            border-radius: 10px;
            padding: 4px 8px;
            margin: -4px -8px;
            transition: background 0.2s;
        }

        .player-info:hover { background: var(--bg-elevated); }

        .player-info .now-title {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-primary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .player-info .now-artist {
            font-size: 0.7rem;
            color: var(--text-secondary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .player-timeline { flex: 1; display: flex; align-items: center; gap: 12px; min-width: 0; }

        .time-label {
            font-size: 0.7rem;
            color: var(--text-secondary);
            min-width: 36px;
            text-align: center;
            user-select: none;
        }

        .timeline-track {
            flex: 1;
            height: 6px;
            border-radius: 3px;
            background: var(--bg-elevated);
            position: relative;
            cursor: pointer;
            touch-action: none;
        }

        .timeline-fill {
            height: 100%;
            width: 0%;
            border-radius: 3px;
            background: var(--accent);
            position: relative;
        }

        .timeline-fill::after {
            content: '';
            position: absolute;
            right: -5px;
            top: 50%;
            transform: translateY(-50%);
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: var(--accent);
            box-shadow: 0 0 6px var(--accent);
            opacity: 0;
            transition: opacity 0.2s;
        }

        .timeline-track:hover .timeline-fill::after { opacity: 1; }

        .video-toggle-btn {
            background: var(--bg-elevated);
            border: 1px solid var(--border-light);
            color: var(--text-secondary);
            width: 40px;
            height: 40px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: var(--transition);
            flex-shrink: 0;
        }

        .video-toggle-btn:hover { color: var(--text-primary); border-color: var(--accent); }
        .video-toggle-btn.active { background: var(--accent-soft); border-color: var(--accent); color: white; }

        .drawer-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease;
            z-index: 40;
        }

        .drawer-overlay.open { opacity: 1; pointer-events: auto; }

        .details-drawer {
            position: fixed;
            top: 0;
            right: 0;
            width: 380px;
            max-width: 100vw;
            height: 100vh;
            height: 100dvh;
            background: var(--bg-secondary);
            border-left: 1px solid var(--border-light);
            box-shadow: -12px 0 30px rgba(0, 0, 0, 0.4);
            transform: translateX(100%);
            transition: transform 0.3s ease;
            z-index: 95;
            display: flex;
            flex-direction: column;
            padding: 28px;
            padding-top: calc(28px + var(--safe-top));
            padding-bottom: calc(28px + var(--safe-bottom));
            gap: 20px;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }

            .main { padding-bottom: calc(var(--mobile-nav-height) + 110px + var(--safe-bottom)); }
        }

        @media (max-height: 500px) and (orientation: landscape) {
            .player-bar {
                grid-template-areas: "controls info timeline video";
                grid-template-columns: auto 1fr 1fr auto;
                padding: 8px 16px;
                padding-left: calc(16px + var(--safe-left));
                padding-right: calc(16px + var(--safe-right));
                padding-bottom: calc(8px + var(--safe-bottom));
                gap: 8px;
            }
            .player-timeline { grid-area: timeline; }
            .main { padding-bottom: calc(var(--mobile-nav-height) + 70px + var(--safe-bottom)); }
            .details-drawer { padding: 16px; gap: 14px; padding-bottom: calc(120px + var(--safe-bottom)); }
            .drawer-cover { max-width: 140px; }
            .toast { bottom: calc(var(--mobile-nav-height) + 75px + var(--safe-bottom)); }
        }

        @media (prefers-reduced-motion: reduce) {
            * { transition-duration: 0.01ms !important; animation-duration: 0.01ms !important; }
        }
    </style>
</head>

    <script>
        (function() {
            const LS_KEY = 'mzmusic_data_v3';
            const MAX_VIDEO_SIZE_MB = 200;
            const MAX_AUDIO_SIZE_MB = 100;
            const MAX_COVER_SIZE_MB = 5;
            const DB_NAME = 'MzMusicDB';
            const DB_VERSION = 4; // bumped for folder handle store

            let tracks = [];
            let playlists = ['Мой плейлист', 'Избранное'];
            let playlistTrackMap = {};
            let activeTrackIndex = -1;
            let isPlaying = false;
            let currentView = 'library';
            let settingsVisible = false;
            let currentDetailIndex = -1;
            let expandedPlaylist = null;
            let objectUrls = {};
            let db = null;
            let mobileMenuTrackIndex = -1;
            let pendingCoverTrackIndex = -1;

            // Folder handle for File System Access API
            let musicFolderHandle = null;
            let isScanning = false;
            let pickerFiles = [];
            let pickerPreviewAudio = null;
            let pickerPreviewIndex = -1;
            let pickerPreviewUrl = null;

            const libraryBtn = document.getElementById('libraryBtn');
            const playlistsBtn = document.getElementById('playlistsBtn');
            const settingsBtn = document.getElementById('settingsBtn');
            const mobileLibraryBtn = document.getElementById('mobileLibraryBtn');
            const mobilePlaylistsBtn = document.getElementById('mobilePlaylistsBtn');
            const mobileSettingsBtn = document.getElementById('mobileSettingsBtn');

            const pageTitle = document.getElementById('pageTitle');
            const dynamicContent = document.getElementById('dynamicContent');
            const settingsPanel = document.getElementById('settingsPanel');
            const headerActions = document.getElementById('headerActions');
            const uploadBtn = document.getElementById('uploadBtn');
            const scanFolderBtn = document.getElementById('scanFolderBtn');
            const fileInput = document.getElementById('fileInput');
            const clearStorageBtn = document.getElementById('clearStorageBtn');
            const storageUsedEl = document.getElementById('storageUsed');
            const storageBarFill = document.getElementById('storageBarFill');
            const folderInfo = document.getElementById('folderInfo');
            const forgetFolderBtn = document.getElementById('forgetFolderBtn');

            const audioEl = document.getElementById('audioEl');
            const videoEl = document.getElementById('videoEl');
            const nowTitle = document.getElementById('nowTitle');
            const nowArtist = document.getElementById('nowArtist');
            const playerInfo = document.getElementById('playerInfo');
            const playPauseBtn = document.getElementById('playPauseBtn');
            const playPauseIcon = document.getElementById('playPauseIcon');
            const prevBtn = document.getElementById('prevBtn');
            const nextBtn = document.getElementById('nextBtn');
            const currentTimeEl = document.getElementById('currentTime');
            const totalTimeEl = document.getElementById('totalTime');
            const timelineTrack = document.getElementById('timelineTrack');
            const timelineFill = document.getElementById('timelineFill');
            const videoToggleBtn = document.getElementById('videoToggleBtn');

            const drawerOverlay = document.getElementById('drawerOverlay');
            const detailsDrawer = document.getElementById('detailsDrawer');
            const drawerClose = document.getElementById('drawerClose');
            const drawerCover = document.getElementById('drawerCover');
            const drawerCoverImg = document.getElementById('drawerCoverImg');
            const drawerVideo = document.getElementById('drawerVideo');
            const detailTitle = document.getElementById('detailTitle');
            const detailArtist = document.getElementById('detailArtist');
            const detailAlbum = document.getElementById('detailAlbum');
            const detailDuration = document.getElementById('detailDuration');
            const detailFormat = document.getElementById('detailFormat');
            const detailPlaylists = document.getElementById('detailPlaylists');
            const detailVideoContainer = document.getElementById('detailVideoContainer');
            const uploadVideoBtn = document.getElementById('uploadVideoBtn');
            const videoFileInput = document.getElementById('videoFileInput');

            const coverFileInputGlobal = document.getElementById('coverFileInputGlobal');

            const mobileDropdownOverlay = document.getElementById('mobileDropdownOverlay');
            const mobileDropdown = document.getElementById('mobileDropdown');
            const mobileDropdownContent = document.getElementById('mobileDropdownContent');

            const musicPickerOverlay = document.getElementById('musicPickerOverlay');
            const musicPickerBody = document.getElementById('musicPickerBody');
            const musicPickerClose = document.getElementById('musicPickerClose');
            const musicPickerScanBtn = document.getElementById('musicPickerScanBtn');
            const musicPickerTitle = document.getElementById('musicPickerTitle');

            const toast = document.getElementById('toast');
            const toastText = document.getElementById('toastText');

            const isMobile = () => window.matchMedia('(max-width: 800px)').matches;

            // Check File System Access API support
            const hasFSAccess = 'showDirectoryPicker' in window;

            // ========== INDEXED DB ==========
            function openDB() {
                return new Promise((resolve, reject) => {
                    if (db) return resolve(db);
                    const req = indexedDB.open(DB_NAME, DB_VERSION);
                    req.onupgradeneeded = (e) => {
                        const database = e.target.result;
                        if (!database.objectStoreNames.contains('videos')) database.createObjectStore('videos');
                        if (!database.objectStoreNames.contains('audio')) database.createObjectStore('audio');
                        if (!database.objectStoreNames.contains('covers')) database.createObjectStore('covers');
                        if (!database.objectStoreNames.contains('folderHandle')) database.createObjectStore('folderHandle');
                    };
                    req.onsuccess = (e) => { db = e.target.result; resolve(db); };
                    req.onerror = (e) => reject(e.target.error);
                });
            }

            function idbPut(store, id, blob) {
                return new Promise(async (resolve, reject) => {
                    try {
                        const database = await openDB();
                        const tx = database.transaction(store, 'readwrite');
                        tx.objectStore(store).put(blob, id);
                        tx.oncomplete = () => resolve(true);
                        tx.onerror = (e) => reject(e.target.error);
                    } catch (e) { reject(e); }
                });
            }

            function idbGet(store, id) {
                return new Promise(async (resolve, reject) => {
                    try {
                        const database = await openDB();
                        const tx = database.transaction(store, 'readonly');
                        const req = tx.objectStore(store).get(id);
                        req.onsuccess = () => resolve(req.result || null);
                        req.onerror = (e) => reject(e.target.error);
                    } catch (e) { reject(e); }
                });
            }

            function idbDelete(store, id) {
                return new Promise(async (resolve) => {
                    try {
                        const database = await openDB();
                        const tx = database.transaction(store, 'readwrite');
                        tx.objectStore(store).delete(id);
                        tx.oncomplete = () => resolve(true);
                        tx.onerror = () => resolve(false);
                    } catch (e) { resolve(false); }
                });
            }

            function idbClear(store) {
                return new Promise(async (resolve) => {
                    try {
                        const database = await openDB();
                        const tx = database.transaction(store, 'readwrite');
                        tx.objectStore(store).clear();
                        tx.oncomplete = () => resolve(true);
                        tx.onerror = () => resolve(false);
                    } catch (e) { resolve(false); }
                });
            }

            async function saveAudioBlob(id, blob) { try { await idbPut('audio', id, blob); return true; } catch (e) { return false; } }
            async function loadAudioBlob(id) { try { return await idbGet('audio', id); } catch (e) { return null; } }
            async function removeAudioBlob(id) {
                await idbDelete('audio', id);
                if (objectUrls['a_' + id]) { try { URL.revokeObjectURL(objectUrls['a_' + id]); } catch (e) {} delete objectUrls['a_' + id]; }
            }

            async function saveVideoBlob(id, blob) {
                if (blob.size > MAX_VIDEO_SIZE_MB * 1024 * 1024) return { ok: false, reason: 'too_large' };
                try { await idbPut('videos', id, blob); return { ok: true }; } catch (e) { return { ok: false, reason: 'error' }; }
            }
            async function loadVideoBlob(id) { try { return await idbGet('videos', id); } catch (e) { return null; } }
            async function removeVideoBlob(id) {
                await idbDelete('videos', id);
                if (objectUrls['v_' + id]) { try { URL.revokeObjectURL(objectUrls['v_' + id]); } catch (e) {} delete objectUrls['v_' + id]; }
            }

            async function saveCoverBlob(id, blob) {
                if (blob.size > MAX_COVER_SIZE_MB * 1024 * 1024) return { ok: false, reason: 'too_large' };
                try { await idbPut('covers', id, blob); return { ok: true }; } catch (e) { return { ok: false, reason: 'error' }; }
            }
            async function loadCoverBlob(id) { try { return await idbGet('covers', id); } catch (e) { return null; } }
            async function removeCoverBlob(id) {
                await idbDelete('covers', id);
                if (objectUrls['c_' + id]) { try { URL.revokeObjectURL(objectUrls['c_' + id]); } catch (e) {} delete objectUrls['c_' + id]; }
            }

            // Folder handle persistence
            async function saveFolderHandle(handle) {
                try { await idbPut('folderHandle', 'music', handle); return true; } catch (e) { return false; }
            }
            async function loadFolderHandle() {
                try { return await idbGet('folderHandle', 'music'); } catch (e) { return null; }
            }
            async function removeFolderHandle() {
                await idbDelete('folderHandle', 'music');
            }

            async function getAudioUrlForTrack(track) {
                if (!track.audioId) return null;
                const key = 'a_' + track.audioId;
                if (objectUrls[key]) return objectUrls[key];
                const blob = await loadAudioBlob(track.audioId);
                if (!blob) return null;
                const url = URL.createObjectURL(blob);
                objectUrls[key] = url;
                return url;
            }

            async function getVideoUrlForTrack(track) {
                if (!track.videoId) return null;
                const key = 'v_' + track.videoId;
                if (objectUrls[key]) return objectUrls[key];
                const blob = await loadVideoBlob(track.videoId);
                if (!blob) return null;
                const url = URL.createObjectURL(blob);
                objectUrls[key] = url;
                return url;
            }

            async function getCoverUrlForTrack(track) {
                if (!track.coverId) return null;
                const key = 'c_' + track.coverId;
                if (objectUrls[key]) return objectUrls[key];
                const blob = await loadCoverBlob(track.coverId);
                if (!blob) return null;
                const url = URL.createObjectURL(blob);
                objectUrls[key] = url;
                return url;
            }

            // ========== STORAGE INFO ==========
            async function updateStorageInfo() {
                try {
                    let audioCount = 0, videoCount = 0, coverCount = 0;
                    const database = await openDB();
                    await new Promise((resolve) => {
                        const tx = database.transaction('audio', 'readonly');
                        const req = tx.objectStore('audio').count();
                        req.onsuccess = () => { audioCount = req.result || 0; resolve(); };
                        req.onerror = () => resolve();
                    });
                    await new Promise((resolve) => {
                        const tx = database.transaction('videos', 'readonly');
                        const req = tx.objectStore('videos').count();
                        req.onsuccess = () => { videoCount = req.result || 0; resolve(); };
                        req.onerror = () => resolve();
                    });
                    await new Promise((resolve) => {
                        const tx = database.transaction('covers', 'readonly');
                        const req = tx.objectStore('covers').count();
                        req.onsuccess = () => { coverCount = req.result || 0; resolve(); };
                        req.onerror = () => resolve();
                    });

                    if (navigator.storage && navigator.storage.estimate) {
                        const est = await navigator.storage.estimate();
                        const usedMB = (est.usage || 0) / (1024 * 1024);
                        const quotaMB = (est.quota || 0) / (1024 * 1024);
                        storageUsedEl.textContent = `${usedMB.toFixed(2)} МБ / ${quotaMB.toFixed(0)} МБ (аудио: ${audioCount}, клипы: ${videoCount}, обложки: ${coverCount})`;
                        const percent = quotaMB ? Math.min(100, (usedMB / quotaMB) * 100) : 0;
                        storageBarFill.style.width = percent + '%';
                        storageBarFill.style.background = percent > 85 ? '#ff6b6b' : 'var(--accent)';
                    } else {
                        storageUsedEl.textContent = `Аудио: ${audioCount}, клипы: ${videoCount}, обложки: ${coverCount}`;
                    }
                } catch (e) { storageUsedEl.textContent = '—'; }
            }

            async function updateFolderInfo() {
                if (!folderInfo) return;
                if (musicFolderHandle) {
                    folderInfo.innerHTML = `Папка: <b>${musicFolderHandle.name}</b> — сканирование доступно`;
                    folderInfo.style.color = 'var(--accent)';
                } else {
                    folderInfo.textContent = 'Папка не выбрана. Нажмите "Сканировать" чтобы выбрать папку с музыкой (только Android Chrome / десктоп).';
                    folderInfo.style.color = 'var(--text-secondary)';
                }
            }

            // ========== PERSISTENCE ==========
            function serializeData() {
                return {
                    tracks: tracks.map(t => ({
                        id: t.id, title: t.title, artist: t.artist, album: t.album,
                        duration: t.duration, format: t.format, mime: t.mime,
                        audioId: t.audioId, videoId: t.videoId, videoMime: t.videoMime,
                        coverId: t.coverId, coverMime: t.coverMime,
                        _originalName: t._originalName, _originalSize: t._originalSize,
                        _lastModified: t._lastModified,
                    })),
                    playlists: playlists,
                    playlistTrackMap: playlistTrackMap,
                    version: 3
                };
            }

            function persistState() {
                try { localStorage.setItem(LS_KEY, JSON.stringify(serializeData())); } catch (e) {}
            }

            async function loadState() {
                const raw = localStorage.getItem(LS_KEY) || localStorage.getItem('mzmusic_data_v2') || localStorage.getItem('mzmusic_data_v1');
                if (!raw) return false;
                try {
                    const data = JSON.parse(raw);
                    if (!data || !Array.isArray(data.tracks)) return false;
                    tracks = data.tracks.map(t => ({
                        id: t.id || ('t_' + Math.random().toString(36).slice(2)),
                        title: t.title || 'Без названия',
                        artist: t.artist || 'Неизвестный исполнитель',
                        album: t.album || '—',
                        duration: t.duration || 0,
                        format: t.format || '—',
                        mime: t.mime || 'audio/mpeg',
                        audioId: t.audioId || null,
                        videoId: t.videoId || null,
                        videoMime: t.videoMime || 'video/mp4',
                        coverId: t.coverId || null,
                        coverMime: t.coverMime || 'image/jpeg',
                        _originalName: t._originalName || null,
                        _originalSize: t._originalSize || null,
                        _lastModified: t._lastModified || null,
                    }));
                    playlists = Array.isArray(data.playlists) && data.playlists.length ? data.playlists : ['Мой плейлист', 'Избранное'];
                    playlistTrackMap = data.playlistTrackMap || {};
                    playlists.forEach(p => { if (!Array.isArray(playlistTrackMap[p])) playlistTrackMap[p] = []; });
                    return true;
                } catch (e) { return false; }
            }

            async function clearAllStorage() {
                localStorage.removeItem(LS_KEY);
                localStorage.removeItem('mzmusic_data_v2');
                localStorage.removeItem('mzmusic_data_v1');
                await idbClear('audio');
                await idbClear('videos');
                await idbClear('covers');
                await idbClear('folderHandle');
                musicFolderHandle = null;
                Object.keys(objectUrls).forEach(k => { try { URL.revokeObjectURL(objectUrls[k]); } catch (e) {} });
                objectUrls = {};
                tracks = [];
                playlists = ['Мой плейлист', 'Избранное'];
                playlistTrackMap = { 'Мой плейлист': [], 'Избранное': [] };
                activeTrackIndex = -1;
                isPlaying = false;
                audioEl.pause();
                audioEl.removeAttribute('src');
                audioEl.load();
                videoEl.pause();
                videoEl.removeAttribute('src');
                videoEl.load();
                updatePlayPauseIcon();
                updatePlayerInfo();
                goToView('library');
                updateStorageInfo();
                updateFolderInfo();
                showToast('Данные очищены');
            }

            // ========== HELPERS ==========
            function formatTime(sec) {
                if (!isFinite(sec) || sec < 0) return '0:00';
                const m = Math.floor(sec / 60);
                const s = Math.floor(sec % 60);
                return `${m}:${s.toString().padStart(2, '0')}`;
            }

            function showToast(msg) {
                toastText.textContent = msg;
                toast.classList.add('show');
                clearTimeout(showToast._t);
                showToast._t = setTimeout(() => toast.classList.remove('show'), 2400);
            }

            function uid(prefix) {
                return (prefix || 'id') + '_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 8);
            }

            function updatePlayPauseIcon() {
                playPauseIcon.textContent = isPlaying ? 'pause' : 'play_arrow';
            }

            function updateTrackCardVisuals() {
                document.querySelectorAll('.track-card').forEach((card) => {
                    const idx = parseInt(card.dataset.index, 10);
                    const isCurrent = (idx === activeTrackIndex);
                    card.classList.toggle('current', isCurrent);
                    card.classList.toggle('playing', isCurrent && isPlaying);
                });
                updateMiniTimelines();
            }

            function updateMiniTimelines() {
                document.querySelectorAll('.track-card').forEach(card => {
                    const idx = parseInt(card.dataset.index, 10);
                    const fill = card.querySelector('.mini-timeline-fill');
                    if (!fill) return;
                    if (idx === activeTrackIndex) {
                        const t = tracks[idx];
                        const dur = audioEl.duration || t.duration || 0;
                        const percent = dur ? Math.min(100, (audioEl.currentTime / dur) * 100) : 0;
                        fill.style.width = percent + '%';
                    } else fill.style.width = '0%';
                });
            }

            function updatePlayerInfo() {
                if (activeTrackIndex < 0) {
                    nowTitle.textContent = 'Ничего не играет';
                    nowArtist.textContent = '—';
                    totalTimeEl.textContent = '0:00';
                    currentTimeEl.textContent = '0:00';
                    timelineFill.style.width = '0%';
                    videoToggleBtn.classList.remove('active');
                    return;
                }
                const t = tracks[activeTrackIndex];
                nowTitle.textContent = t.title;
                nowArtist.textContent = t.artist;
                totalTimeEl.textContent = formatTime(t.duration || audioEl.duration || 0);
                currentTimeEl.textContent = formatTime(audioEl.currentTime || 0);
                if (audioEl.duration && isFinite(audioEl.duration)) {
                    timelineFill.style.width = Math.min(100, (audioEl.currentTime / audioEl.duration) * 100) + '%';
                }
                if (t.videoId) {
                    videoToggleBtn.style.opacity = '1';
                    const isShown = drawerVideo.style.display !== 'none' && drawerVideo.src;
                    videoToggleBtn.classList.toggle('active', !!isShown);
                } else {
                    videoToggleBtn.style.opacity = '0.4';
                    videoToggleBtn.classList.remove('active');
                }
            }

            function getTrackById(id) { return tracks.find(t => t.id === id); }

            function getPlaylistsForTrack(trackId) {
                const result = [];
                playlists.forEach(p => {
                    if ((playlistTrackMap[p] || []).includes(trackId)) result.push(p);
                });
                return result;
            }

            function addTrackToPlaylist(trackId, playlistName) {
                if (!playlistTrackMap[playlistName]) playlistTrackMap[playlistName] = [];
                if (!playlistTrackMap[playlistName].includes(trackId)) {
                    playlistTrackMap[playlistName].push(trackId);
                    persistState();
                    return true;
                }
                return false;
            }

            function removeTrackFromPlaylist(trackId, playlistName) {
                if (!playlistTrackMap[playlistName]) return false;
                const idx = playlistTrackMap[playlistName].indexOf(trackId);
                if (idx >= 0) {
                    playlistTrackMap[playlistName].splice(idx, 1);
                    persistState();
                    return true;
                }
                return false;
            }

            // ========== FILE SYSTEM ACCESS API — SCAN FOLDER ==========
            async function pickMusicFolder() {
                if (!hasFSAccess) {
                    showToast('Ваш браузер не поддерживает автосканирование. Выберите файлы вручную.');
                    fileInput.click();
                    return;
                }
                try {
                    const handle = await window.showDirectoryPicker({ mode: 'read' });
                    if (handle) {
                        musicFolderHandle = handle;
                        await saveFolderHandle(handle);
                        updateFolderInfo();
                        showToast('Папка выбрана: ' + handle.name);
                        await scanFolderAndShowList();
                    }
                } catch (e) {
                    if (e.name !== 'AbortError') {
                        console.warn('Directory picker error:', e);
                        showToast('Не удалось открыть папку');
                    }
                }
            }

            async function ensureFolderPermission(handle) {
                if (!handle || !handle.queryPermission) return false;
                const opts = { mode: 'read' };
                let perm = await handle.queryPermission(opts);
                if (perm === 'granted') return true;
                if (perm === 'prompt') {
                    perm = await handle.requestPermission(opts);
                    return perm === 'granted';
                }
                return false;
            }

            async function scanFolderAndShowList() {
                if (!musicFolderHandle) {
                    await pickMusicFolder();
                    return;
                }
                const granted = await ensureFolderPermission(musicFolderHandle);
                if (!granted) {
                    showToast('Нет доступа к папке');
                    return;
                }
                if (isScanning) return;
                isScanning = true;

                musicPickerOverlay.classList.add('open');
                musicPickerTitle.textContent = 'Сканирование...';
                musicPickerBody.innerHTML = `<div class="picker-scanning">
                    <div class="scan-spinner"></div>
                    <span>Сканируем папку «${musicFolderHandle.name}»...</span>
                </div>`;

                try {
                    pickerFiles = [];
                    await scanDirectoryRecursive(musicFolderHandle, '');
                    isScanning = false;
                    musicPickerTitle.textContent = `Найдено файлов: ${pickerFiles.length}`;
                    if (pickerFiles.length === 0) {
                        musicPickerBody.innerHTML = `<div class="music-picker-empty">
                            <span class="material-icons">music_off</span>
                            В папке не найдено аудиофайлов. Попробуйте другую папку.
                        </div>`;
                    } else {
                        renderPickerFiles();
                    }
                } catch (e) {
                    isScanning = false;
                    console.error('Scan error:', e);
                    musicPickerBody.innerHTML = `<div class="music-picker-empty">
                        <span class="material-icons">error</span>
                        Ошибка сканирования: ${e.message || 'неизвестная'}
                    </div>`;
                }
            }

            async function scanDirectoryRecursive(dirHandle, prefix) {
                for await (const entry of dirHandle.values()) {
                    if (entry.kind === 'file') {
                        const name = entry.name;
                        const lower = name.toLowerCase();
                        if (/\.(mp3|m4a|aac|ogg|wav|flac|opus|wma|webm|oga|weba)$/i.test(lower)) {
                            try {
                                const file = await entry.getFile();
                                // Attach relative path info
                                file._relativePath = prefix + name;
                                pickerFiles.push(file);
                                // Update UI count live
                                if (pickerFiles.length % 5 === 0) {
                                    musicPickerTitle.textContent = `Сканирование... найдено ${pickerFiles.length}`;
                                }
                            } catch (e) {
                                console.warn('Could not read file:', name, e);
                            }
                        }
                    } else if (entry.kind === 'directory') {
                        try {
                            await scanDirectoryRecursive(entry, prefix + entry.name + '/');
                        } catch (e) {
                            console.warn('Could not read subdir:', entry.name, e);
                        }
                    }
                }
            }

            function renderPickerFiles() {
                if (pickerFiles.length === 0) {
                    musicPickerBody.innerHTML = `<div class="music-picker-empty">
                        <span class="material-icons">music_off</span>
                        Файлы не найдены
                    </div>`;
                    return;
                }

                let html = '';
                // Show folder info
                if (musicFolderHandle) {
                    html += `<div class="folder-handle-info">
                        <span class="material-icons">folder</span>
                        Папка: <span class="folder-name">${musicFolderHandle.name}</span> · ${pickerFiles.length} файлов
                    </div>`;
                }

                pickerFiles.forEach((file, i) => {
                    const name = file._relativePath || file.name;
                    const size = file.size < 1024 * 1024
                        ? (file.size / 1024).toFixed(0) + ' KB'
                        : (file.size / (1024 * 1024)).toFixed(1) + ' MB';
                    const isPlaying = pickerPreviewIndex === i;
                    const isAdded = tracks.some(t => t._originalName === file.name && t._originalSize === file.size);

                    html += `
                        <div class="picker-file-row" data-picker-index="${i}">
                            <button class="picker-play-indicator ${isPlaying ? 'playing' : ''}" data-preview-index="${i}" title="Прослушать">
                                <span class="material-icons indicator-icon">${isPlaying ? 'pause' : 'play_arrow'}</span>
                            </button>
                            <div class="picker-file-info" data-file-select-index="${i}">
                                <span class="picker-file-name">${name}</span>
                                <span class="picker-file-meta">${size} · ${isAdded ? 'уже добавлен' : 'нажмите для выбора'}</span>
                                <div class="picker-file-preview-bar" id="picker-bar-${i}">
                                    <div class="picker-file-preview-fill" id="picker-fill-${i}" style="width:0%"></div>
                                </div>
                            </div>
                            <button class="picker-file-add-btn ${isAdded ? 'added' : ''}" data-add-file-index="${i}" title="${isAdded ? 'Уже добавлен' : 'Добавить'}">
                                <span class="material-icons">${isAdded ? 'check' : 'add'}</span>
                            </button>
                        </div>
                    `;
                });

                musicPickerBody.innerHTML = html;

                musicPickerBody.onclick = (e) => {
                    const previewBtn = e.target.closest('[data-preview-index]');
                    if (previewBtn) {
                        e.stopPropagation();
                        const idx = parseInt(previewBtn.dataset.previewIndex, 10);
                        togglePreview(idx);
                        return;
                    }

                    const addBtn = e.target.closest('[data-add-file-index]');
                    if (addBtn) {
                        e.stopPropagation();
                        const idx = parseInt(addBtn.dataset.addFileIndex, 10);
                        addPickerFileToLibrary(idx);
                        return;
                    }

                    const fileInfo = e.target.closest('[data-file-select-index]');
                    if (fileInfo) {
                        const idx = parseInt(fileInfo.dataset.fileSelectIndex, 10);
                        togglePreview(idx);
                        return;
                    }
                };
            }

            function togglePreview(index) {
                if (pickerPreviewIndex === index) {
                    stopPreview();
                    return;
                }
                stopPreview();

                const file = pickerFiles[index];
                if (!file) return;

                pickerPreviewUrl = URL.createObjectURL(file);
                pickerPreviewAudio = new Audio(pickerPreviewUrl);
                pickerPreviewAudio.preload = 'metadata';
                pickerPreviewIndex = index;

                pickerPreviewAudio.addEventListener('timeupdate', () => {
                    if (pickerPreviewIndex !== index) return;
                    const bar = document.getElementById('picker-fill-' + index);
                    if (bar && pickerPreviewAudio.duration) {
                        bar.style.width = Math.min(100, (pickerPreviewAudio.currentTime / pickerPreviewAudio.duration) * 100) + '%';
                    }
                });

                pickerPreviewAudio.addEventListener('ended', () => {
                    stopPreview();
                });

                pickerPreviewAudio.play().then(() => {
                    updatePickerPreviewButtons();
                }).catch(() => {
                    showToast('Не удалось воспроизвести');
                    stopPreview();
                });
            }

            function stopPreview() {
                if (pickerPreviewAudio) {
                    try { pickerPreviewAudio.pause(); } catch (e) {}
                    pickerPreviewAudio = null;
                }
                if (pickerPreviewUrl) {
                    try { URL.revokeObjectURL(pickerPreviewUrl); } catch (e) {}
                    pickerPreviewUrl = null;
                }
                pickerPreviewIndex = -1;
                updatePickerPreviewButtons();
                pickerFiles.forEach((_, i) => {
                    const fill = document.getElementById('picker-fill-' + i);
                    if (fill) fill.style.width = '0%';
                });
            }

            function updatePickerPreviewButtons() {
                document.querySelectorAll('.picker-play-indicator').forEach(btn => {
                    const idx = parseInt(btn.dataset.previewIndex, 10);
                    if (idx === pickerPreviewIndex) {
                        btn.classList.add('playing');
                        const icon = btn.querySelector('.indicator-icon');
                        if (icon) icon.textContent = 'pause';
                    } else {
                        btn.classList.remove('playing');
                        const icon = btn.querySelector('.indicator-icon');
                        if (icon) icon.textContent = 'play_arrow';
                    }
                });
            }

            async function addPickerFileToLibrary(index) {
                const file = pickerFiles[index];
                if (!file) return;
                if (file.size > MAX_AUDIO_SIZE_MB * 1024 * 1024) {
                    showToast(`Файл слишком большой (макс. ${MAX_AUDIO_SIZE_MB} МБ)`);
                    return;
                }

                const isDuplicate = tracks.some(t => t._originalName === file.name && t._originalSize === file.size);
                if (isDuplicate) {
                    showToast('Этот файл уже добавлен');
                    return;
                }

                const audioId = uid('a');
                const saved = await saveAudioBlob(audioId, file);
                if (!saved) { showToast('Не удалось сохранить'); return; }

                const url = URL.createObjectURL(file);
                objectUrls['a_' + audioId] = url;
                const meta = await readMetadata(file, url);

                tracks.push({
                    id: uid('t'),
                    title: meta.title,
                    artist: meta.artist,
                    album: meta.album,
                    duration: meta.duration || 0,
                    format: meta.format || '—',
                    mime: file.type || 'audio/mpeg',
                    audioId: audioId,
                    videoId: null,
                    videoMime: null,
                    coverId: null,
                    coverMime: null,
                    _originalName: file.name,
                    _originalSize: file.size,
                    _lastModified: file.lastModified,
                });

                persistState();
                showToast('Добавлено: ' + (file._relativePath || file.name));

                // Update the button visually
                const addBtn = musicPickerBody.querySelector(`[data-add-file-index="${index}"]`);
                if (addBtn) {
                    addBtn.classList.add('added');
                    addBtn.innerHTML = '<span class="material-icons">check</span>';
                }
                const metaEl = musicPickerBody.querySelector(`[data-file-select-index="${index}"] .picker-file-meta`);
                if (metaEl) metaEl.textContent = metaEl.textContent.split(' · ')[0] + ' · уже добавлен';

                if (currentView === 'library') renderLibrary();
                else goToView('library');
                updateStorageInfo();

                if (pickerPreviewIndex === index) stopPreview();
            }

            function closeMusicPicker() {
                stopPreview();
                pickerFiles = [];
                musicPickerOverlay.classList.remove('open');
                musicPickerBody.onclick = null;
            }

            musicPickerClose.addEventListener('click', closeMusicPicker);
            musicPickerOverlay.addEventListener('click', (e) => {
                if (e.target === musicPickerOverlay) closeMusicPicker();
            });

            musicPickerScanBtn.addEventListener('click', () => {
                if (musicFolderHandle) {
                    scanFolderAndShowList();
                } else {
                    pickMusicFolder();
                }
            });

            // ========== SCAN BUTTON ==========
            scanFolderBtn.addEventListener('click', () => {
                if (!hasFSAccess) {
                    showToast('Автосканирование не поддерживается. Выберите файлы вручную.');
                    fileInput.click();
                    return;
                }
                if (musicFolderHandle) {
                    scanFolderAndShowList();
                } else {
                    pickMusicFolder();
                }
            });

            forgetFolderBtn.addEventListener('click', async () => {
                if (confirm('Забыть выбранную папку? При следующем сканировании нужно будет снова выбрать папку.')) {
                    await removeFolderHandle();
                    musicFolderHandle = null;
                    updateFolderInfo();
                    showToast('Папка забыта');
                }
            });

            // ========== UPLOAD BUTTON (manual) ==========
            uploadBtn.addEventListener('click', () => {
                fileInput.click();
            });

            fileInput.addEventListener('change', async (e) => {
                const files = Array.from(e.target.files || []);
                if (files.length === 0) return;

                let added = 0, failed = 0;
                for (const file of files) {
                    if (!file.type.startsWith('audio/') && !/\.(mp3|m4a|aac|ogg|wav|flac|opus|wma|webm|oga)$/i.test(file.name)) {
                        showToast('Пропущен: ' + file.name);
                        failed++;
                        continue;
                    }
                    if (file.size > MAX_AUDIO_SIZE_MB * 1024 * 1024) {
                        showToast(`Файл слишком большой: ${file.name}`);
                        failed++;
                        continue;
                    }
                    const audioId = uid('a');
                    const saved = await saveAudioBlob(audioId, file);
                    if (!saved) { failed++; continue; }
                    const url = URL.createObjectURL(file);
                    objectUrls['a_' + audioId] = url;
                    const meta = await readMetadata(file, url);
                    tracks.push({
                        id: uid('t'),
                        title: meta.title,
                        artist: meta.artist,
                        album: meta.album,
                        duration: meta.duration || 0,
                        format: meta.format || '—',
                        mime: file.type || 'audio/mpeg',
                        audioId: audioId,
                        videoId: null,
                        videoMime: null,
                        coverId: null,
                        coverMime: null,
                        _originalName: file.name,
                        _originalSize: file.size,
                        _lastModified: file.lastModified,
                    });
                    added++;
                }

                fileInput.value = '';
                persistState();
                showToast(`Добавлено: ${added}${failed ? ', ошибок: ' + failed : ''}`);
                if (currentView === 'library') renderLibrary();
                else goToView('library');
                updateStorageInfo();
            });

            function readMetadata(file, url) {
                return new Promise((resolve) => {
                    const fallback = {
                        title: file.name.replace(/\.[^.]+$/, ''),
                        artist: 'Неизвестный исполнитель',
                        album: '—',
                        duration: 0,
                        format: (file.type.split('/')[1] || '—').toUpperCase(),
                    };

                    const tempAudio = new Audio();
                    tempAudio.preload = 'metadata';
                    tempAudio.src = url;

                    const done = (meta) => {
                        if (!meta.duration || meta.duration <= 0) {
                            const finish = () => {
                                if (isFinite(tempAudio.duration) && tempAudio.duration > 0) meta.duration = tempAudio.duration;
                                tempAudio.src = '';
                                resolve(meta);
                            };
                            tempAudio.addEventListener('loadedmetadata', finish, { once: true });
                            tempAudio.addEventListener('error', () => { tempAudio.src = ''; resolve(meta); }, { once: true });
                            setTimeout(() => { if (!meta.duration) resolve(meta); }, 2000);
                        } else resolve(meta);
                    };

                    if (window.jsmediatags) {
                        try {
                            window.jsmediatags.read(file, {
                                onSuccess: (tag) => {
                                    const tags = tag.tags || {};
                                    done({
                                        title: tags.title || fallback.title,
                                        artist: tags.artist || fallback.artist,
                                        album: tags.album || fallback.album,
                                        duration: 0,
                                        format: (tags.format || '').includes('MP3') ? 'MP3' : fallback.format,
                                    });
                                },
                                onError: () => done(fallback),
                            });
                        } catch (err) { done(fallback); }
                    } else {
                        tempAudio.addEventListener('loadedmetadata', () => {
                            if (isFinite(tempAudio.duration)) fallback.duration = tempAudio.duration;
                        }, { once: true });
                        done(fallback);
                    }
                });
            }

            (function loadJsmediatags() {
                const script = document.createElement('script');
                script.src = 'https://cdn.jsdelivr.net/npm/jsmediatags@3.9.7/dist/jsmediatags.min.js';
                script.async = true;
                script.onerror = () => console.warn('jsmediatags failed to load');
                document.head.appendChild(script);
            })();

            // ========== PLAYBACK ==========
            async function playTrack(index, autoPlay = true) {
                if (index < 0 || index >= tracks.length) return;
                const track = tracks[index];
                const audioUrl = await getAudioUrlForTrack(track);
                if (!audioUrl) { showToast('Аудиофайл не найден'); return; }

                if (activeTrackIndex === index) {
                    if (autoPlay) {
                        if (isPlaying) { audioEl.pause(); isPlaying = false; }
                        else {
                            audioEl.play().then(() => {
                                isPlaying = true;
                                updatePlayPauseIcon();
                                updateTrackCardVisuals();
                                if (track.videoId) {
                                    hardSyncVideo();
                                    if (drawerVideo.style.display !== 'none' && drawerVideo.src) {
                                        try { drawerVideo.currentTime = audioEl.currentTime; } catch (e) {}
                                        drawerVideo.play().catch(() => {});
                                    }
                                }
                            }).catch(() => { isPlaying = false; updatePlayPauseIcon(); updateTrackCardVisuals(); });
                        }
                    }
                    updateTrackCardVisuals();
                    updatePlayerInfo();
                    return;
                }

                activeTrackIndex = index;
                isPlaying = false;
                audioEl.src = audioUrl;
                audioEl.load();

                nowTitle.textContent = track.title;
                nowArtist.textContent = track.artist;
                totalTimeEl.textContent = formatTime(track.duration || 0);
                currentTimeEl.textContent = '0:00';
                timelineFill.style.width = '0%';

                const videoUrl = await getVideoUrlForTrack(track);
                if (videoUrl) { videoEl.src = videoUrl; videoEl.load(); videoEl.muted = true; }
                else { videoEl.removeAttribute('src'); videoEl.load(); }

                if (currentDetailIndex === index) refreshDrawer(index);

                if (autoPlay) {
                    audioEl.play().then(() => {
                        isPlaying = true;
                        updatePlayPauseIcon();
                        updateTrackCardVisuals();
                        if (videoUrl) {
                            videoEl.currentTime = 0;
                            hardSyncVideo();
                            if (drawerVideo.style.display !== 'none' && drawerVideo.src) {
                                try { drawerVideo.currentTime = 0; } catch (e) {}
                                drawerVideo.play().catch(() => {});
                            }
                        }
                    }).catch(() => { isPlaying = false; updatePlayPauseIcon(); updateTrackCardVisuals(); });
                } else {
                    updatePlayPauseIcon();
                    updateTrackCardVisuals();
                }
                updatePlayerInfo();
            }

            function playNext() {
                if (tracks.length === 0) return;
                playTrack((activeTrackIndex + 1) % tracks.length, true);
            }

            function playPrev() {
                if (tracks.length === 0) return;
                playTrack((activeTrackIndex - 1 + tracks.length) % tracks.length, true);
            }

            async function hardSyncVideo() {
                if (activeTrackIndex < 0) return;
                const t = tracks[activeTrackIndex];
                if (!t.videoId) return;
                const url = await getVideoUrlForTrack(t);
                if (!url) return;
                if (videoEl.src !== url) { videoEl.src = url; videoEl.load(); }
                videoEl.muted = true;
                try {
                    if (Math.abs(videoEl.currentTime - audioEl.currentTime) > 0.05) videoEl.currentTime = audioEl.currentTime;
                } catch (e) {}
            }

            async function syncVideoSeek() {
                if (activeTrackIndex < 0) return;
                const t = tracks[activeTrackIndex];
                if (!t.videoId) return;
                const url = await getVideoUrlForTrack(t);
                if (!url) return;
                if (videoEl.src !== url) { videoEl.src = url; videoEl.load(); }
                try { videoEl.currentTime = audioEl.currentTime || 0; } catch (e) {}
                if (isPlaying) videoEl.play().catch(() => {});
                else videoEl.pause();
            }

            audioEl.addEventListener('timeupdate', () => {
                if (activeTrackIndex < 0) return;
                const t = tracks[activeTrackIndex];
                if (t.videoId && videoEl.src) {
                    if (Math.abs(videoEl.currentTime - audioEl.currentTime) > 0.15) {
                        try { videoEl.currentTime = audioEl.currentTime; } catch (e) {}
                    }
                }
                if (drawerVideo.style.display !== 'none' && drawerVideo.src && t.videoId) {
